<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — Brokerage OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ================= DESIGN TOKENS (unchanged) ================= */
:root{
  --bg:#F5F3EE; --card:#FFFFFF; --line:#E6E1D6; --line2:#EEEAE1;
  --ink:#1C1915; --ink2:#57524A; --ink3:#8A857C; --ink4:#B3AEA4;
  --accent:#1F6B4D; --accent-ink:#155038; --accent-bg:#E9F2EC; --accent-bd:#CFE0D5;
  --red:#B23A2E; --red-bg:#F7E9E6; --red-bd:#EBCFC9;
  --amber:#9A6B14; --amber-bg:#F6EFDD; --amber-bd:#E8DCC0;
  --teal:#1B6E77; --teal-bg:#E6F1F2;
  --side:#16130F;
  --radius:12px;
  --shadow:0 1px 2px rgba(28,25,21,.05),0 10px 28px -14px rgba(28,25,21,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
::selection{background:#CFE0D5}
button{font:inherit;cursor:pointer}
.ic{flex:none;display:inline-block;vertical-align:-3px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#D6D1C6;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;min-height:100vh}
#sidebar{width:230px;position:fixed;top:0;bottom:0;left:0;background:var(--side);color:#A39D92;display:flex;flex-direction:column;z-index:40}
.brand{padding:22px 20px 18px;border-bottom:1px solid #26211A}
.brand h1{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:27px;color:#F5F2EA;letter-spacing:.01em}
.brand small{display:block;font-size:9.5px;letter-spacing:.24em;color:#6B655B;margin-top:4px;text-transform:uppercase}
.nav{flex:1;overflow-y:auto;padding:8px 12px 28px}
.nav-group{margin-top:15px}
.nav-group>div{font-size:10px;letter-spacing:.15em;color:#5C574E;text-transform:uppercase;padding:0 10px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:#A39D92;cursor:pointer;font-size:13px;margin-bottom:1px}
.nav-item:hover{background:#201C16;color:#D8D3C9}
.nav-item.active{background:#292319;color:#F5F2EA}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:600;border-radius:99px;padding:1px 6px;min-width:17px;text-align:center}
#main{margin-left:230px;flex:1;min-width:0;display:flex;flex-direction:column}

#topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:35}
.burger{display:none;background:none;border:0;color:var(--ink2)}
.searchbox{position:relative;width:340px;max-width:42vw}
.searchbox input{width:100%;height:34px;border:1px solid var(--line);background:#FAF8F4;border-radius:8px;padding:0 58px 0 32px;font:inherit;color:var(--ink)}
.searchbox input:focus{outline:2px solid rgba(31,107,77,.22);border-color:var(--accent);background:#fff}
.searchbox>.ic{position:absolute;left:10px;top:9px;color:var(--ink3)}
.searchbox kbd{position:absolute;right:9px;top:8px;font-family:inherit;font-size:10px;color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:#fff}
.seg{display:flex;background:#EFECE5;border-radius:8px;padding:2px;margin-left:auto}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--ink3)}
.seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(28,25,21,.1)}
.demo-pill,.live-pill{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:700;letter-spacing:.09em;border-radius:99px;padding:4px 10px;text-transform:uppercase;white-space:nowrap;border:1px solid transparent}
.demo-pill{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-bd)}
.demo-pill i{width:6px;height:6px;border-radius:50%;background:#C8922B;animation:blink 2.6s infinite}
.live-pill{color:var(--accent-ink);background:var(--accent-bg);border-color:var(--accent-bd)}
.live-pill i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
@keyframes blink{50%{opacity:.25}}
.bell{position:relative;background:none;border:0;color:var(--ink2);padding:6px;border-radius:8px}
.bell:hover{background:#F1EEE7}
.bell .badge{position:absolute;top:1px;right:0;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;border-radius:99px;padding:0 4px;min-width:15px}
.avatar-btn{display:flex;align-items:center;gap:9px;background:none;border:0;padding:4px 6px;border-radius:8px}
.avatar-btn:hover{background:#F1EEE7}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;background:#E9F2EC;color:var(--accent-ink)}
.pop{position:absolute;top:46px;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:200px;padding:6px;z-index:50}
.pop .pi{display:flex;width:100%;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;border:0;background:none;font-size:13px;color:var(--ink);text-align:left}
.pop .pi:hover{background:#F5F3EE}
.sresults{position:absolute;top:40px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:440px;overflow:auto;padding:6px;z-index:55}
.sr-group{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:7px 9px 4px}
.sr-item{display:flex;gap:10px;align-items:center;padding:7px 9px;border-radius:7px;cursor:pointer}
.sr-item:hover{background:#F5F3EE}
.sr-item b{font-weight:600}
.sr-item .cellsub{font-size:11.5px;color:var(--ink3)}

#page{padding:24px 26px 70px;max-width:1460px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.eyebrow{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:5px}
.page-head h1{font-size:23px;font-weight:650;letter-spacing:-.01em}
.page-head .sub{color:var(--ink2);font-size:13px;margin-top:3px;max-width:680px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(28,25,21,.04)}
.card .card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;gap:10px}
.card .card-t{font-size:13.5px;font-weight:650}
.card .card-sub{font-size:11.5px;color:var(--ink3)}
.card .card-b{padding:0 16px 16px}
.card-b.flush{padding:0}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}

.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:border-color .15s;position:relative}
.kpi:hover{border-color:#C8C2B4}
.kpi .k-label{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.kpi .k-val{font-size:24px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin:3px 0 7px}
.kpi .k-sub{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink3)}
.kpi .spark{position:absolute;right:14px;bottom:14px;opacity:.9}
.kpi .go{position:absolute;top:12px;right:12px;color:var(--ink4);opacity:0;transition:.15s}
.kpi:hover .go{opacity:1;color:var(--ink3)}

.brief{background:var(--side);color:#C9C4BA;border-radius:14px;padding:20px 22px;margin-bottom:16px;position:relative;overflow:hidden}
.brief::after{content:'';position:absolute;right:-60px;top:-70px;width:260px;height:260px;border-radius:50%;border:1px solid #2A2419;pointer-events:none}
.brief::before{content:'';position:absolute;right:-20px;top:-110px;width:260px;height:260px;border-radius:50%;border:1px solid #241F16;pointer-events:none}
.b-eyebrow{font-family:'Instrument Serif',serif;font-style:italic;font-size:20px;color:#F5F2EA}
.b-date{font-size:10.5px;color:#7E786D;letter-spacing:.1em;text-transform:uppercase;margin-top:3px;font-weight:600}
.brief ul{list-style:none;margin-top:15px;display:flex;flex-direction:column;gap:9px;position:relative;z-index:1}
.brief li{display:flex;gap:11px;font-size:13.5px;align-items:baseline}
.brief li .ic{align-self:center;color:#6FA08A}
.b-link{color:#F5F2EA;font-weight:600;cursor:pointer;border-bottom:1px dotted #6B655B;white-space:nowrap}
.b-link:hover{border-bottom-color:#F5F2EA}

.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:760px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums;vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:#FAF8F4}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num,.tbl th.num{text-align:right}
.cellstrong{font-weight:600}
.cellsub{font-size:11.5px;color:var(--ink3);margin-top:1px}
.ovd{color:var(--red);font-weight:600}
.scorecell{display:flex;align-items:center;gap:8px}
.s-num{font-weight:650;font-variant-numeric:tabular-nums}
.sbar{width:44px;height:4px;border-radius:3px;background:#EFEDE8;overflow:hidden}
.sbar i{display:block;height:100%;border-radius:3px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid transparent;white-space:nowrap}
.c-green{color:var(--accent-ink);background:var(--accent-bg);border-color:var(--accent-bd)}
.c-green-d{color:#0E3D2B;background:#D3E6DB;border-color:#B3CDBF}
.c-amber{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-bd)}
.c-red{color:var(--red);background:var(--red-bg);border-color:var(--red-bd)}
.c-teal{color:var(--teal);background:var(--teal-bg);border-color:#C8DDE0}
.c-slate{color:#4E5A54;background:#EAEEEA;border-color:#D4DCD6}
.c-gray{color:#7A756C;background:#EFEDE8;border-color:#E0DCD2}
.c-ink{color:var(--ink);background:#EDEAE3;border-color:#DCD7CB}
.c-orange{color:#A4562C;background:#F6E8DF;border-color:#E5CDBB}

.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#F5F2EA;font-size:13px;font-weight:600;transition:background .15s}
.btn:hover{background:#33302A}
.btn.ghost{background:#fff;color:var(--ink);border-color:#D8D3C8}
.btn.ghost:hover{background:#FAF8F4;border-color:#C5BFB2}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn.danger:hover{background:#983226}
.btn:disabled{opacity:.6;cursor:default}
.ibtn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid #D8D3C8;background:#fff;color:var(--ink2)}
.ibtn:hover{background:#F5F3EE;color:var(--ink)}
.inp{height:34px;border:1px solid #D8D3C8;background:#fff;border-radius:8px;padding:0 10px;font:inherit;color:var(--ink);width:100%}
.inp:focus{outline:2px solid rgba(31,107,77,.22);border-color:var(--accent)}
textarea.inp{height:auto;padding:8px 10px;min-height:70px;resize:vertical}
label.f{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:12px 0 4px}
label.f:first-child{margin-top:0}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fhint{font-size:11px;color:var(--ink3);margin-top:3px}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filterbar .inp{width:auto;min-width:150px}

.dleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}
.dleg span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#57524A}
.dleg i{width:9px;height:9px;border-radius:3px;flex:none}
.dleg b{font-variant-numeric:tabular-nums;font-weight:650;color:#1C1915}
.duo{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.duo .dleg{margin-top:0}
.gridl{stroke:#EEEAE1;stroke-width:1;stroke-dasharray:3 4}
.axt{font-size:10px;fill:#8A857C}
.axv{font-size:10.5px;fill:#57524A;font-weight:650}
.bars .brow{display:grid;grid-template-columns:118px 1fr 92px;gap:10px;align-items:center;padding:5px 0;font-size:12.5px}
.bars .btrack{height:8px;background:#EFEDE8;border-radius:5px;overflow:hidden}
.bars .btrack i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.bars .bval{text-align:right;font-variant-numeric:tabular-nums;color:#57524A;font-weight:600;font-size:11.5px;white-space:nowrap}
.stk{display:flex;flex-direction:column;gap:10px}
.stkrow{display:grid;grid-template-columns:88px 1fr 54px;gap:10px;align-items:center}
.stkl{font-size:12px;color:#57524A;text-align:right;white-space:nowrap}
.stktrack{display:flex;height:15px;border-radius:7px;overflow:hidden;background:#EFEDE8}
.stktrack i{display:block;height:100%}
.mfun{display:flex;flex-direction:column;gap:8px;padding:4px 0}
.mfr{display:grid;grid-template-columns:112px 1fr 96px;gap:10px;align-items:center}
.mfl{font-size:12px;color:#57524A;text-align:right}
.mft{height:16px;border-radius:5px;background:#EFEDE8;overflow:hidden}
.mft i{display:block;height:100%;background:#1F6B4D;border-radius:5px}
.mfr em{font-style:normal;color:#8A857C;font-size:11px}

#drawerWrap,#modalWrap{position:fixed;inset:0;z-index:60;pointer-events:none}
#drawerWrap.open,#modalWrap.open{pointer-events:auto}
.d-bg,.m-bg{position:absolute;inset:0;background:rgba(22,19,15,.35);opacity:0;transition:.2s}
#drawerWrap.open .d-bg,#modalWrap.open .m-bg{opacity:1}
.drawer{position:absolute;top:0;right:0;bottom:0;width:520px;max-width:95vw;background:#fff;border-left:1px solid var(--line);transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-24px 0 60px -30px rgba(28,25,21,.3)}
#drawerWrap.open .drawer{transform:none}
.d-h{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.d-h .t{font-size:16px;font-weight:650;flex:1;min-width:0}
.d-b{flex:1;overflow-y:auto;padding:16px 18px 34px}
.d-sec{margin-bottom:20px}
.d-sec .st{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--line2)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:4px 0;font-size:13px}
.kv .k{color:var(--ink3)}
.kv .v{font-weight:500;text-align:right}
.modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-46%);opacity:0;width:600px;max-width:94vw;max-height:88vh;background:#fff;border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.2s}
#modalWrap.open .modal{transform:translate(-50%,-50%);opacity:1}
.m-h{display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line);font-size:15.5px;font-weight:650}
.m-b{padding:16px 18px;overflow-y:auto}
.m-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
#toasts{position:fixed;right:20px;bottom:20px;z-index:95;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:#F5F2EA;padding:11px 14px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);max-width:400px;animation:tin .22s ease}
.toast .ev{font-size:10px;color:#9EC5AF;font-family:ui-monospace,SFMono-Regular,monospace;display:block;margin-top:2px}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

.sk{border-radius:8px;background:#EDEAE3;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.statebox{padding:48px 20px;text-align:center;color:var(--ink3)}
.statebox .t{font-weight:650;color:var(--ink2);margin:10px 0 4px;font-size:14px}
.retrybtn{margin-top:14px}

.kan{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.kcol{min-width:238px;width:238px;flex:none;background:#F1EEE7;border:1px solid var(--line);border-radius:var(--radius);padding:10px;max-height:calc(100vh - 420px);display:flex;flex-direction:column}
.kcol-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 9px;font-size:11.5px;font-weight:700}
.kcol-h .cnt{color:var(--ink3);font-weight:600}
.kcol-b{overflow-y:auto;flex:1;min-height:40px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:8px;cursor:pointer;transition:.15s}
.kcard:hover{border-color:#C5BFB2;box-shadow:0 3px 10px -4px rgba(28,25,21,.15)}
.kcard .kv1{display:flex;justify-content:space-between;font-weight:650;font-size:12.5px}
.kcard .kv2{display:flex;justify-content:space-between;color:var(--ink3);font-size:11.5px;margin-top:5px}
.stale-dot{width:7px;height:7px;border-radius:50%;background:var(--red);display:inline-block;margin-left:5px}

.tmap{display:flex;gap:22px;overflow-x:auto;padding:8px 2px 14px}
.twr{min-width:200px}
.twr-h{text-align:center;font-weight:650;padding:8px 0;font-size:12px}
.trow{display:flex;gap:3px;justify-content:center;margin-bottom:3px;align-items:center}
.trow .fl{width:22px;font-size:10px;color:var(--ink3);text-align:right;font-variant-numeric:tabular-nums}
.ucell{width:42px;height:24px;border-radius:4px;font-size:9.5px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ucell:hover{outline:2px solid var(--accent);outline-offset:1px}
.s-Available{background:#C8DCCF;color:#155038}.s-Hold{background:#E8D9AE;color:#6E5314}
.s-Token{background:#E3C9B8;color:#7A3E23}.s-Booked{background:#C9C2B4;color:#2A261F}
.s-Agreement{background:#B7C7CC;color:#2C4A52}.s-Registered{background:#9CC0AC;color:#123B29}
.s-Sold{background:#1F6B4D;color:#F5F2EA}.s-Unavailable{background:#E4E0D8;color:#8A857C}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 2px 0}
.legend span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2)}
.legend i{width:11px;height:11px;border-radius:3px}

.wa{display:grid;grid-template-columns:310px 1fr;gap:14px;min-height:600px;height:calc(100vh - 200px)}
.wa-list{overflow-y:auto}
.wa-c{display:flex;gap:11px;padding:12px 13px;cursor:pointer;border-bottom:1px solid var(--line2);align-items:center}
.wa-c:hover{background:#FAF8F4}
.wa-c.active{background:#F1EEE7}
.wa-c .nm{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.wa-c .sn{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-c .tm{font-size:10.5px;color:var(--ink4);margin-left:auto;flex:none;align-self:flex-start}
.wa-c .ubadge{background:var(--accent);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:0 6px;min-width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center}
.wa-thread{display:flex;flex-direction:column;overflow:hidden}
.wa-banner{display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--amber-bg);color:var(--amber);font-size:12px;font-weight:600}

<script>
'use strict';
/* =====================================================================
   MERIDIAN — India Real Estate Brokerage OS — PRODUCTION BUILD
   REAL SUPABASE → SERVICE LAYER → UI (existing Meridian design)

   /config     → env placeholders (VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY
                 in a Vite build; constants or the connect-screen here)
   /supabase   → single client (anon key ONLY, in-memory auth session —
                 nothing is ever written to localStorage/sessionStorage)
   /auth       → Supabase Auth + agent profile (agents.user_id) + organization
   /mapping    → DB rows ↔ internal UI shapes (the ONE place to adjust
                 column names if your schema differs)
   /remote     → R.* production queries per table
   /services   → routed facade: Demo Mode → mock closure; Production → R.*
   /demo       → the old mock store, isolated, never touches Supabase
   /ui         → pages/drawers/actions — unchanged design, service calls only

   AUDIT: localStorage 0 · sessionStorage 0 · IndexedDB 0 · cookies 0.
   mockDB exists only inside the /demo closure. The organization id is
   NEVER hardcoded — it is resolved from the authenticated agent profile.
   ===================================================================== */

/* ============================== /config ============================== */
const CONFIG = {
  SUPABASE_URL: '',            // ← VITE_SUPABASE_URL      (anon access only)
  SUPABASE_ANON_KEY: '',       // ← VITE_SUPABASE_ANON_KEY (NEVER service-role)
  AI_CHAT_ENDPOINT: '',        // e.g. https://your-api.example/api/ai/chat
  simulateLatency: true,       // demo-mode skeletons only
  simulateErrors: false,       // demo-mode error/retry demo only
  brokerageDefaults: { pct: 1, fixed: 500000, gst: 18, tds: 2, agentSplit: 50 },
};

/* ============================== /utils ============================== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const NOW = new Date();
const demoMode = () => App.mode === 'demo';
const prodMode = () => App.mode === 'production';

/* — /utils/inr — values stay numeric; display ₹1.2 Cr / ₹85 L / ₹1,25,00,000 */
function inr(n){
  if (n == null || isNaN(n)) return '—';
  const sign = n < 0 ? '−' : ''; n = Math.abs(n);
  if (n >= 1e7){ const v = n/1e7; return sign + '₹' + (v >= 10 ? v.toFixed(1) : v.toFixed(2)).replace(/\.?0+$/,'').replace(/(\.\d)0$/,'$1') + ' Cr'; }
  if (n >= 1e5){ const v = n/1e5; return sign + '₹' + v.toFixed(1).replace(/\.0$/,'') + ' L'; }
  return sign + '₹' + Math.round(n).toLocaleString('en-IN');
}
function inrFull(n){ return (n == null || isNaN(n)) ? '—' : '₹' + Math.round(n).toLocaleString('en-IN'); }
function psf(rate){ return '₹' + Math.round(rate).toLocaleString('en-IN') + '/sq.ft'; }

/* — /utils/date — ISO internally, Indian display, Asia/Kolkata — */
const IST = 'Asia/Kolkata';
function istParts(iso){
  const d = new Date(iso); if (isNaN(d)) return null;
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: IST, day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true }).formatToParts(d);
  const get = t => p.find(x => x.type === t)?.value || '';
  return { day: get('day'), mon: get('month'), year: get('year'), hour: get('hour'), min: get('minute'), ap: get('dayPeriod') || get('dayPeriod') };
}
function fmtDate(iso){ if (!iso) return '—'; const x = istParts(iso); return x ? `${x.day} ${x.mon} ${x.year}` : '—'; }
function fmtDT(iso){ if (!iso) return '—'; const x = istParts(iso); return x ? `${x.day} ${x.mon}, ${x.hour}:${x.min} ${x.ap}` : '—'; }
function timeAgo(iso){ if (!iso) return '—'; const s = (Date.now() - new Date(iso))/1000;
  if (s < 3600) return Math.max(1,Math.floor(s/60)) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  const d = s/86400; return d < 45 ? Math.floor(d) + 'd ago' : Math.floor(d/30) + 'mo ago'; }
function timeIn(iso){ if (!iso) return '—'; const s = (new Date(iso) - Date.now())/1000;
  if (s < 3600) return 'in ' + Math.max(1,Math.floor(s/60)) + 'm';
  if (s < 86400) return 'in ' + Math.floor(s/3600) + 'h';
  return 'in ' + Math.floor(s/86400) + 'd'; }
const hoursSince = iso => (Date.now() - new Date(iso)) / 36e5;
function fmtRange(r){ return { '30D':'Last 30 days', MTD:'Month to date', QTD:'Quarter to date', YTD:'Year to date', ALL:'All time' }[r]; }
function rangeStart(r){
  const d = new Date(NOW);
  if (r === '30D') return new Date(d.getTime() - 30*864e5);
  if (r === 'MTD') return new Date(d.getFullYear(), d.getMonth(), 1);
  if (r === 'QTD') return new Date(d.getFullYear(), d.getMonth() - d.getMonth()%3, 1);
  if (r === 'YTD') return new Date(d.getFullYear(), 0, 1);
  return new Date(0);
}
const inRange = (iso, r) => !iso || new Date(iso) >= rangeStart(r);
const initials = n => String(n || '?').split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
const dISO = d => d.toISOString();
const daysAgo = n => dISO(new Date(NOW.getTime() - n*864e5));
const hoursAgo = h => dISO(new Date(NOW.getTime() - h*36e5));
const inDays = n => dISO(new Date(NOW.getTime() + n*864e5));

/* seeded RNG — demo data only, never persisted */
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a);
  t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(20260912);
const pick = arr => arr[Math.floor(rnd()*arr.length)];
const ri = (a,b) => a + Math.floor(rnd()*(b-a+1));
const weighted = pairs => { const tot = pairs.reduce((s,p)=>s+p[1],0); let r = rnd()*tot;
  for (const [v,w] of pairs){ if ((r -= w) <= 0) return v; } return pairs[0][0]; };

const byId = (arr, id) => arr.find(x => x.id === id);
const nmOf = agents => { const m = Object.fromEntries(agents.map(a => [a.id, a.name])); return id => m[id] || 'Unassigned'; };
const descBy = key => (a, b) => new Date(b[key] || 0) - new Date(a[key] || 0);

/* ============================== /rules — brokerage math (shared, pure) ============================== */
const brokerageCalc = {
  forDeal(deal){
    const brokerage = deal.brokerageType === 'Fixed' ? (deal.fixedAmt || 0) : deal.value * (deal.brokeragePct || 0) / 100;
    const gstPct = deal.gstPct ?? (deal.gst ? 18 : 0);
    const gst = brokerage * gstPct / 100;
    const tds = brokerage * .02;
    const cpPayout = brokerage * (deal.cpPct || 0) / 100;
    const net = brokerage - cpPayout;
    const agentSplit = net * (deal.agentSplitPct || 50) / 100;
    const houseShare = net - agentSplit;
    return { brokerage, gst, tds, cpPayout, net, agentSplit, houseShare, netReceivable: brokerage + gst - tds };
  }
};

/* ============================== pipeline (shared; loads pipeline_stages in production) ============================== */
const DEFAULT_STAGES = [
  { id:'new',            label:'New Lead',              prob:0.03 },
  { id:'contacted',      label:'Contacted',             prob:0.06 },
  { id:'qualified',      label:'Qualified',             prob:0.10 },
  { id:'shortlisted',    label:'Property Shortlisted',  prob:0.15 },
  { id:'visit_scheduled',label:'Site Visit Scheduled',  prob:0.20 },
  { id:'visit_done',     label:'Site Visit Completed',  prob:0.25 },
  { id:'interested',     label:'Interested',            prob:0.32 },
  { id:'negotiation',    label:'Negotiation',           prob:0.45 },
  { id:'token',          label:'Token / EOI',           prob:0.65 },
  { id:'booking',        label:'Booking',               prob:0.80 },
  { id:'agreement',      label:'Agreement',             prob:0.90 },
  { id:'registration',   label:'Registration',          prob:0.95 },
  { id:'closed',         label:'Closed',                prob:1 },
  { id:'lost',           label:'Lost',                  prob:0 },
];
const pipelineService = {
  _stages: DEFAULT_STAGES.map(s => ({...s})),
  async load(){ /* production: read pipeline_stages table */
    try {
      const rows = await sel('pipeline_stages', { limit: 50 });
      if (rows && rows.length){
        const mapped = rows.map(r => {
          const prob = val(r, ['probability','win_probability','win_prob'], 0) || 0;
          return { id: r.id, label: val(r, ['label','name','title'], String(r.id)),
            prob: prob > 1 ? prob / 100 : prob,
            won: !!val(r, ['is_won','won','is_terminal_won'], false),
            lost: !!val(r, ['is_lost','lost'], false) };
        }).sort((a,b) => (a.sort ?? 0) - (b.sort ?? 0));
        this._stages = mapped;
      }
    } catch(e){ console.warn('pipeline_stages not readable — using built-in defaults:', e.message); }
  },
  stages(){ return this._stages.map(s => ({...s})); },
  stage(id){ return this._stages.find(s => s.id === id) || { id, label: String(id), prob: 0 }; },
  activeIds(){ return this._stages.filter(s => !s.won && !s.lost && !['closed','lost'].includes(s.id)).map(s => s.id); },
  idx(id){ return this._stages.findIndex(s => s.id === id); },
  move(id, dir){ const i = this._stages.findIndex(s => s.id === id); const j = i + dir;
    if (j < 3 || j > this._stages.length - 3 || i < 0) return;
    const [s] = this._stages.splice(i,1); this._stages.splice(j,0,s); },
  reset(){ this._stages = DEFAULT_STAGES.map(s => ({...s})); },
};
const EVENT_CATALOG = ['lead.created','lead.assigned','lead.scored','lead.status_changed','lead.followup_due','lead.followup_overdue',
  'site_visit.created','site_visit.confirmed','site_visit.completed','deal.created','deal.stage_changed','deal.won','deal.lost',
  'commission.created','commission.received','message.sent','inventory.hold','task.completed'];

/* ============================== lead scoring (shared; prefers DB score when present) ============================== */
const leadScoringService = {
  sourceQuality:{ Referral:10, 'Existing Client':10, 'Walk-in':9, 'Channel Partner':8, Website:7, WhatsApp:7, 'Direct Developer':7, 'Google Business':6, Phone:6, 'Google Ads':5, 'Meta Ads':5, Instagram:5, '99acres':5, MagicBricks:5, 'Housing.com':5, PropTiger:5, 'Offline Campaign':5, NoBroker:4, 'Other Portal':4, Other:4 },
  breakdown(l){
    if (!l) return { factors: [], total: 0 };
    const f = [];
    f.push(['Buying intent', ({Hot:22,Warm:14,Cold:5,Nurture:2})[l.intent] || 5, 22]);
    f.push(['Budget clarity', l.req?.budgetMax ? (l.req.budgetMax >= 3e7 ? 15 : l.req.budgetMax >= 1.2e7 ? 12 : 9) : 0, 15]);
    f.push(['Financial readiness', ({Cash:15,'Loan Approved':15,'Loan Applied':11,'Home Loan Required':6,'Financing Unknown':2})[l.financial] || 2, 15]);
    f.push(['Timeline', ({Immediate:13,'0–3 months':12,'3–6 months':8,'Under construction':7,'6–12 months':5,Exploring:2})[l.req?.possession] || 5, 13]);
    const h = hoursSince(l.lastActivityAt);
    f.push(['Engagement', h < 48 ? 12 : h < 168 ? 7 : 3, 12]);
    f.push(['Source quality', this.sourceQuality[l.source] || 4, 10]);
    f.push(['Site visits', l.visitCount > 1 ? 8 : l.visitCount === 1 ? 6 : 0, 8]);
    f.push(['Decision maker', l.decision?.decisionMaker ? 5 : 2, 5]);
    return { factors:f, total: Math.min(100, f.reduce((s,x)=>s+x[1],0)) };
  },
  score(l){ return l && l.dbScore != null ? l.dbScore : this.breakdown(l).total; },
  temperature(total){ return total >= 75 ? 'HOT' : total >= 45 ? 'WARM' : 'COLD'; },
  tempOf(l){ return String(l?.dbTemperature || this.temperature(this.score(l))).toUpperCase(); },
  silentHot(leads){ return leads.filter(l => this.score(l) >= 70 && !['closed','lost'].includes(l.stage) && pipelineService.activeIds().includes(l.stage) && hoursSince(l.lastActivityAt) > 48); },
};

/* ============================== /analytics — pure functions over service data ============================== */
const analyticsService = {
  agentStats(agents, leads, deals, commissions, visits, tasks, range){
    return agents.map(a => {
      const myLeads = leads.filter(l => l.agentId === a.id);
      const contacted = myLeads.filter(l => l.stage !== 'new').length;
      const myDeals = deals.filter(d => d.agentId === a.id);
      const closed = myDeals.filter(d => (d.stage === 'closed' || pipelineService.stage(d.stage).won) && inRange(d.closedAt, range));
      const myComm = commissions.filter(c => c.agentId === a.id);
      return { ...a,
        leads: myLeads.length, contacted, contactRate: myLeads.length ? contacted/myLeads.length : 0,
        qualified: myLeads.filter(l => !['new','contacted','lost'].includes(l.stage)).length,
        visits: visits.filter(v => v.agentId === a.id && v.status === 'Completed').length,
        bookings: myDeals.filter(d => ['booking','agreement','registration','closed'].includes(d.stage) || pipelineService.stage(d.stage).won).length,
        closures: closed.length, revenue: closed.reduce((s,d)=>s+(d.value||0),0),
        commission: myComm.reduce((s,c)=>s+(c.agentSplit||0),0),
        conversion: myLeads.length ? closed.length/myLeads.length : 0,
        overdue: tasks.filter(t => t.agentId === a.id && t.status === 'Pending' && new Date(t.dueAt) < NOW).length };
    }).sort((x,y) => y.revenue - x.revenue);
  },
  overview(data, range){
    const { leads, deals, visits, tasks, commissions } = data;
    const activeIds = pipelineService.activeIds();
    const activeLeads = leads.filter(l => activeIds.includes(l.stage));
    const activeDeals = deals.filter(d => activeIds.includes(d.stage));
    const closedDeals = deals.filter(d => (d.stage === 'closed' || pipelineService.stage(d.stage).won) && inRange(d.closedAt, range));
    const lostDeals = deals.filter(d => (d.stage === 'lost' || pipelineService.stage(d.stage).lost) && inRange(d.updatedAt, range));
    const probs = s => pipelineService.stage(s).prob;
    const visitsIn = visits.filter(v => inRange(v.date, range));
    const isToday = iso => iso && new Date(iso).toLocaleDateString('en-IN', { timeZone: IST }) === NOW.toLocaleDateString('en-IN', { timeZone: IST });
    return {
      closedRevenue: closedDeals.reduce((s,d)=>s+(d.value||0),0), closedCount: closedDeals.length,

/* =====================================================================
   /supabase — single client (anon key only; auth session in memory)
   ===================================================================== */
let _supa = null;
const memStore = () => { const m = new Map(); return { getItem: k => m.get(k) ?? null, setItem: (k,v) => m.set(k, v), removeItem: k => m.delete(k) }; };
async function client(){
  if (_supa) return _supa;
  if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY) throw new Error('Supabase is not configured');
  const mod = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  _supa = mod.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, storage: memStore() }  // session lives in memory only — no browser storage
  });
  return _supa;
}
async function softClient(){ try { return await client(); } catch(e){ return null; } }
async function sel(table, o = {}){
  const c = await client();
  let q = c.from(table).select(o.cols || '*');
  for (const [k, v] of Object.entries(o.eq || {})) q = q.eq(k, v);
  if (o.limit) q = q.limit(o.limit);
  const res = await q;
  if (res.error) throw new Error(`${table}: ${res.error.message}`);
  return res.data || [];
}
async function ins(table, rows){
  const c = await client();
  const res = await c.from(table).insert(rows).select();
  if (res.error) throw new Error(`${table} insert: ${res.error.message}`);
  return res.data || [];
}
async function upd(table, eq, patch){
  const c = await client();
  let q = c.from(table).update(patch);
  for (const [k, v] of Object.entries(eq || {})) q = q.eq(k, v);
  const res = await q.select();
  if (res.error) throw new Error(`${table} update: ${res.error.message}`);
  return res.data || [];
}

async function remoteSearch(q){
  const like = `%${q}%`;
  const groups = { leads: [], projects: [], properties: [], inventory: [], deals: [], agents: [] };
  try {
    const c = await client();
    const [leads, projects, properties, units, deals, agents] = await Promise.all([
      c.from('leads').select('id,name,phone,locality,source_name').ilike('name', like).limit(5),
      c.from('projects').select('id,name,developer,locality').ilike('name', like).limit(5),
      c.from('properties').select('id,title,locality,price').ilike('title', like).limit(5),
      c.from('inventory_units').select('id,project_id,tower,unit_number,configuration,price').ilike('unit_number', like).limit(5),
      c.from('deals').select('id,buyer_name,value,stage').ilike('buyer_name', like).limit(5),
      c.from('agents').select('id,name,role').ilike('name', like).limit(3),
    ]);
    groups.leads = (leads.data || []).map(x => ({ id:x.id, name:x.name, phone:x.phone || '', source:x.source_name || '' }));
    groups.projects = (projects.data || []).map(x => ({ id:x.id, name:x.name, developer:x.developer || '', locality:x.locality || '' }));
    groups.properties = (properties.data || []).map(x => ({ id:x.id, title:x.title, locality:x.locality, price:x.price }));
    groups.inventory = (units.data || []).map(x => ({ id:x.id, projectId:x.project_id, tower:x.tower, unitNo:x.unit_number, config:x.configuration, price:x.price }));
    groups.deals = (deals.data || []).map(x => ({ id:x.id, buyer:x.buyer_name, value:x.value, stage:x.stage }));
    groups.agents = (agents.data || []).map(x => ({ id:x.id, name:x.name, role:x.role }));
  } catch(e){ /* search degrades to empty rather than crashing */ }
  return groups;
}

const authService = {
  _profile: null, _demoSession: null,
  async init(){
    const c = await softClient();
    if (!c){ renderLoginScreen('setup'); return; }
    try {
      const { data } = await c.auth.getSession();
      if (data?.session?.user){
        await this.refreshProfile();
        App.mode = 'production'; await startApp(); return;
      }
    } catch(e){ renderLoginScreen('login', 'Could not restore session: ' + e.message); return; }
    renderLoginScreen('login');
  },
  async connect(url, key){
    CONFIG.SUPABASE_URL = String(url || '').trim(); CONFIG.SUPABASE_ANON_KEY = String(key || '').trim();
    _supa = null;
    if (!CONFIG.SUPABASE_URL.startsWith('http')) throw new Error('The project URL must start with https://');
    if (CONFIG.SUPABASE_ANON_KEY.length < 20) throw new Error('That does not look like a valid anon key');
    await client(); // validates the client
    try {
      const { data } = await _supa.auth.getSession();
      if (data?.session?.user){ await this.refreshProfile(); App.mode = 'production'; await startApp(); return; }
    } catch(e){}
    renderLoginScreen('login');
  },
  async signIn(email, password){
    const c = await client();
    const { error } = await c.auth.signInWithPassword({ email: String(email).trim(), password });
    if (error) throw error;
    await this.refreshProfile();
    App.mode = 'production';
    await startApp();
  },
  async signOut(){
    if (App.mode === 'production'){ const c = await softClient(); if (c) await c.auth.signOut(); }
    App.mode = null; this._profile = null; this._demoSession = null;
    renderLoginScreen(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY ? 'login' : 'setup');
  },
  async enterDemo(){
    App.mode = 'demo';
    this._demoSession = { name:'Demo Owner', role:'Owner', email:'demo@meridianrealty.in', organizationId:'demo-org' };
    await startApp();
  },
  async refreshProfile(){
    const c = await client();
    const { data: { user }, error } = await c.auth.getUser();
    if (error || !user) throw new Error('Not authenticated');
    const rows = await sel('agents', { cols: '*, organization:organizations(*)', eq: { user_id: user.id } });
    const agent = rows[0] || null;
    if (!agent) throw new Error('No agent record is linked to this user — create an agents row with user_id set.');
    this._profile = { user, agent, organization: agent.organization || null };
    return this._profile;
  },
  profile(){ return this._profile; },
  getCurrentUser(){
    if (App.mode === 'demo') return this._demoSession;
    const p = this._profile; if (!p) return null;
    return { name: p.agent?.name || p.user?.email || 'Team member', role: p.agent?.role || 'Agent',
      email: p.user?.email || '', organizationId: p.organization?.id || null };
  },
  getSession(){ if (App.mode === 'demo') return { user: this._demoSession, organizationId:'demo-org', provider:'demo' };
    const p = this._profile; return p ? { user: { name: p.agent?.name, role: p.agent?.role, email: p.user?.email },
      organizationId: p.organization?.id, provider:'supabase' } : null; },
};

  const max = Math.max(...data, 1); const pts = data.map((v,i)=>`${(i*(w/(data.length-1||1))).toFixed(1)},${(h-3-(v/max)*(h-8)).toFixed(1)}`).join(' ');

const CHART_COLORS = ['#1F6B4D','#9CC0AC','#C8922B','#B23A2E','#4E5A54','#1B6E77','#7A3E23','#155038','#B3AEA4','#8A857C'];
const STATUS_COLORS = { Available:'#C8DCCF', Hold:'#E8D9AE', Token:'#E3C9B8', Booked:'#C9C2B4', Agreement:'#B7C7CC', Registered:'#9CC0AC', Sold:'#1F6B4D', Unavailable:'#E4E0D8' };
const charts = {
  donut(parts, size = 148, thick = 18, center = null){
    const total = parts.reduce((s, p) => s + p.value, 0);
    const r = (size - thick) / 2 - 1, C = 2 * Math.PI * r; let off = 0;
    const segs = parts.map((p, i) => { const col = p.color || CHART_COLORS[i % CHART_COLORS.length];
      const len = total ? p.value / total * C : 0;
      const s = total ? `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${thick}" stroke-dasharray="${len.toFixed(2)} ${Math.max(0, C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"><title>${esc(p.label)}: ${p.tip || p.value}</title></circle>` : '';
      off += len; return s; }).join('');
    const svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${segs}${center ? `<text x="${size/2}" y="${size/2 + 4}" text-anchor="middle" font-size="${Math.round(size*.14)}" font-weight="650" fill="#1C1915">${esc(center.v)}</text><text x="${size/2}" y="${Math.round(size/2 + size*.14)}" text-anchor="middle" font-size="10" fill="#8A857C">${esc(center.l)}</text>` : ''}</svg>`;
    const legend = `<div class="dleg">${parts.map((p, i) => `<span><i style="background:${p.color || CHART_COLORS[i % CHART_COLORS.length]}"></i>${esc(p.label)} <b>${p.tip || p.value}</b></span>`).join('')}</div>`;
    return { svg, legend };
  },
  line(pts, opts = {}){
    const w = 520, h = opts.h || 168, pl = 48, pb = 20, pt = 10, pr = 6;
    if (pts.length < 2) return '<div class="cellsub" style="padding:24px 0">Not enough data points yet.</div>';
    const max = Math.max(...pts.map(p => p.v), 1);
    const X = i => pl + i * (w - pl - pr) / (pts.length - 1), Y = v => h - pb - v / max * (h - pb - pt);
    const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
    const grid = [0, .5, 1].map(f => `<line x1="${pl}" x2="${w - pr}" y1="${Y(max * f).toFixed(1)}" y2="${Y(max * f).toFixed(1)}" class="gridl"/><text x="${pl - 6}" y="${(Y(max * f) + 3).toFixed(1)}" text-anchor="end" class="axt">${opts.fmt ? opts.fmt(max * f) : Math.round(max * f)}</text>`).join('');
    const dots = pts.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.2" fill="${p.cur ? '#1C1915' : '#1F6B4D'}" stroke="#fff" stroke-width="1.5"><title>${esc(p.l)}: ${opts.tip ? opts.tip(p.v) : p.v}</title></circle>`).join('');
    const xl = pts.map((p, i) => (pts.length > 9 && i % 2) ? '' : `<text x="${X(i).toFixed(1)}" y="${h - 6}" text-anchor="middle" class="axt">${esc(p.l)}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">${grid}<path d="${path} L ${X(pts.length - 1).toFixed(1)} ${h - pb} L ${pl} ${h - pb} Z" fill="rgba(31,107,77,.07)"/><path d="${path}" fill="none" stroke="#1F6B4D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}</svg>`;
  },
  vbars(data, opts = {}){
    const w = 520, h = opts.h || 168, pb = 20, pt = opts.values ? 22 : 12, pl = 48;
    const max = Math.max(...data.flatMap(d => [d.v, d.v2 || 0]), 1);
    const bw = (w - pl - 8) / data.length, Y = v => h - pb - v / max * (h - pb - pt);
    const grid = [0, .5, 1].map(f => `<line x1="${pl}" x2="${w - 8}" y1="${Y(max * f).toFixed(1)}" y2="${Y(max * f).toFixed(1)}" class="gridl"/><text x="${pl - 6}" y="${(Y(max * f) + 3).toFixed(1)}" text-anchor="end" class="axt">${opts.fmt ? opts.fmt(max * f) : Math.round(max * f)}</text>`).join('');
    const bars = data.map((d, i) => { const x = pl + i * bw + bw * .16, bwd = bw * (d.v2 != null ? .38 : .62);
      let s = `<rect x="${x.toFixed(1)}" y="${Y(d.v).toFixed(1)}" width="${bwd.toFixed(1)}" height="${Math.max(0, h - pb - Y(d.v)).toFixed(1)}" rx="4" fill="${d.color || '#1F6B4D'}" opacity="${d.cur ? 1 : .85}"><title>${esc(d.l)}: ${opts.tip ? opts.tip(d.v) : d.v}</title></rect>`;
      if (d.v2 != null) s += `<rect x="${(x + bwd + 2).toFixed(1)}" y="${Y(d.v2).toFixed(1)}" width="${bwd.toFixed(1)}" height="${Math.max(0, h - pb - Y(d.v2)).toFixed(1)}" rx="4" fill="${d.color2 || '#C8922B'}" opacity=".9"><title>${esc(d.l)}: ${opts.tip ? opts.tip(d.v2) : d.v2}</title></rect>`;
      s += `<text x="${(pl + i * bw + bw / 2).toFixed(1)}" y="${h - 6}" text-anchor="middle" class="axt">${esc(d.l)}</text>`;
      if (opts.values && d.v) s += `<text x="${(pl + i * bw + bw / 2).toFixed(1)}" y="${(Y(d.v) - 6).toFixed(1)}" text-anchor="middle" class="axv">${opts.tip ? opts.tip(d.v) : d.v}</text>`;
      return s; }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">${grid}${bars}</svg>`;
  },
  hbars(items, opts = {}){
    const max = Math.max(...items.map(i => i.v), 1);
    return `<div class="bars">${items.map(it => `<div class="brow" ${it.act || ''} style="${it.act ? 'cursor:pointer' : ''}"><span style="color:#57524A;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" ${it.title ? `title="${esc(it.title)}"` : ''}>${esc(it.l)}</span><div class="btrack"><i style="width:${(it.v / max * 100).toFixed(1)}%;background:${it.c || '#1F6B4D'}"></i></div><span class="bval">${it.tip != null ? it.tip : it.v}</span></div>`).join('')}</div>`;
  },
  scatter(pts, opts = {}){
    if (!pts.length) return '<div class="cellsub" style="padding:24px 0">No data points yet.</div>';
    const w = 520, h = opts.h || 195, pl = 44, pb = 26, pt = 12, pr = 10;
    const xmax = Math.max(...pts.map(p => p.x), 1), ymax = Math.max(...pts.map(p => p.y), 1);
    const rmax = Math.max(...pts.map(p => p.r || 0), 1);
    const X = x => pl + x / xmax * (w - pl - pr), Y = y => h - pb - y / ymax * (h - pb - pt);
    const grid = [0, .5, 1].map(f => `<line x1="${pl}" x2="${w - pr}" y1="${Y(ymax * f).toFixed(1)}" y2="${Y(ymax * f).toFixed(1)}" class="gridl"/><text x="${pl - 6}" y="${(Y(ymax * f) + 3).toFixed(1)}" text-anchor="end" class="axt">${opts.yfmt ? opts.yfmt(ymax * f) : Math.round(ymax * f)}</text>`).join('');
    const xl = [.5, 1].map(f => `<text x="${X(xmax * f).toFixed(1)}" y="${h - 8}" text-anchor="middle" class="axt">${opts.xfmt ? opts.xfmt(xmax * f) : Math.round(xmax * f)}</text>`).join('');
    const dots = pts.map(p => `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${(5 + (p.r || 0) / rmax * 10).toFixed(1)}" fill="${p.color || '#1F6B4D'}" fill-opacity=".75" stroke="#fff" stroke-width="1.5" style="cursor:pointer" ${p.act || ''}><title>${esc(p.tip || p.label)}</title></circle>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">${grid}<line x1="${pl}" x2="${w - pr}" y1="${h - pb}" y2="${h - pb}" stroke="#D8D3C8"/>${xl}${opts.xlabel ? `<text x="${w - pr}" y="${h - 8}" text-anchor="end" class="axt" font-style="italic">${esc(opts.xlabel)}</text>` : ''}${dots}</svg>`;
  },
  stacked(rows, opts = {}){
    const total = Math.max(...rows.map(r => r.segs.reduce((s, x) => s + x.v, 0)), 1);
    return `<div class="stk">${rows.map(r => { const t = r.segs.reduce((s, x) => s + x.v, 0);
      return `<div class="stkrow"><span class="stkl">${esc(r.label)}</span><div class="stktrack">${r.segs.filter(s => s.v > 0).map(s => `<i style="width:${(s.v / total * 100).toFixed(2)}%;background:${s.c}" title="${esc(s.label)}: ${s.v}"></i>`).join('')}</div><span class="bval">${opts.tip ? opts.tip(t) : t}</span></div>`; }).join('')}</div>`;
  },
  miniFunnel(steps){
    const top = steps[0].v || 1;
    return `<div class="mfun">${steps.map((s, i) => `<div class="mfr"><span class="mfl">${esc(s.l)}</span><div class="mft"><i style="width:${Math.max(0, s.v / top * 100).toFixed(1)}%;background:${i === steps.length - 1 ? '#155038' : '#1F6B4D'};opacity:${(.5 + .5 * (i / Math.max(1, steps.length - 1))).toFixed(2)}"></i></div><span class="bval">${s.v.toLocaleString('en-IN')}${i ? ` <em>${(s.v / top * 100).toFixed(0)}%</em>` : ''}</span></div>`).join('')}</div>`;
  },
};

function toast(msg, ev){

  t.innerHTML = `${icon('check',15)}<span>${msg}${ev && demoMode() ? `<span class="ev">event: ${esc(ev)}</span>` : ''}</span>`;

    const sec = (title, items, render) => items.length ? `<div class="sr-group">${title}</div>` + items.map(render).join('') : '';
    box.innerHTML =
      sec('Leads', r.leads, l => `<div class="sr-item" data-action="searchPick" data-kind="lead" data-id="${l.id}">${icon('users',15)}<div><b>${esc(l.name)}</b><div class="cellsub">${esc(l.phone || '')} ${l.source ? '· ' + esc(l.source) : ''}</div></div></div>`) +

      sec('Properties', r.properties, p => `<div class="sr-item" data-action="searchPick" data-kind="property" data-id="${p.id}">${icon('home',15)}<div><b>${esc(p.title)}${p.locality ? ' · ' + esc(p.locality) : ''}</b><div class="cellsub">${inr(p.price)}</div></div></div>`) +

PAGES.pipeline = { async render(root, p, seq){
  const [deals, projects, agents] = await Promise.all([dealService.getDeals(), projectService.getProjects(), agentService.getAgents()]);
  if (seq !== renderSeq) return;
  const agentNm = nmOf(agents), projNm = id => (byId(projects, id) || {name:'Resale'}).name;
  const stages = pipelineService.stages().filter(s => !['new','contacted'].includes(s.id));
  const active = deals.filter(d => pipelineService.activeIds().includes(d.stage) && !['new','contacted'].includes(d.stage));
  const weighted = active.reduce((s,d) => s + (d.value || 0) * pipelineService.stage(d.stage).prob, 0);
  const stageItems = stages.map(s => { const items = deals.filter(d => d.stage === s.id); const v = items.reduce((a, d) => a + (d.value || 0), 0);
    return { l: s.label, v, tip: items.length + ' deals · ' + inr(v), c: s.won ? '#155038' : (s.lost || s.id === 'lost') ? '#B3AEA4' : ['token','booking','agreement','registration'].includes(s.id) ? '#C8922B' : '#1F6B4D' }; });
  const ageLabels = ['0–7d','8–14d','15–21d','22–35d','36d+']; const ageCounts = [0, 0, 0, 0, 0];
  active.forEach(d => { const days = hoursSince(d.updatedAt) / 24; ageCounts[days <= 7 ? 0 : days <= 14 ? 1 : days <= 21 ? 2 : days <= 35 ? 3 : 4]++; });
  const agentShare = (() => { const m = {}; active.forEach(d => m[d.agentId] = (m[d.agentId] || 0) + (d.value || 0));
    const entries = Object.entries(m).filter(e => e[0] && e[0] !== 'null').sort((a, b) => b[1] - a[1]);
    const parts = entries.slice(0, 5).map(([id, v]) => ({ label: agentNm(id), value: v, tip: inr(v) }));
    const rest = entries.slice(5).reduce((s, e) => s + e[1], 0);
    if (rest) parts.push({ label: 'Others', value: rest, tip: inr(rest), color: '#B3AEA4' });
    return charts.donut(parts, 132, 15, { v: active.length, l: 'deals' }); })();
  root.innerHTML = `
    ${pageHead('Sales', 'Pipeline', `${active.length} active deals · ${inr(active.reduce((s,d)=>s+(d.value||0),0))} value · <b>${inr(weighted)} weighted</b>. Stages served by <span class="mono">pipelineService</span>${demoMode() ? '' : ' from the pipeline_stages table'}.`)}
    <div class="grid g3">
      ${card('Value by stage', charts.hbars(stageItems), { sub: 'hover for deal counts' })}
      ${card('Deal aging — days since last update', charts.vbars(ageLabels.map((l, i) => ({ l, v: ageCounts[i], color: i >= 3 ? '#B23A2E' : i === 2 ? '#C8922B' : '#1F6B4D' })), { h: 138, values: true, tip: v => v + ' deals' }), { sub: 'active deals · red = stale risk' })}
      ${card('Pipeline by agent', `<div class="duo">${agentShare.svg}<div>${agentShare.legend}</div></div>`, { sub: 'share of active pipeline value' })}
    </div>
    <div class="kan">${stages.map(s => {
      const items = deals.filter(d => d.stage === s.id);
      return `<div class="kcol"><div class="kcol-h"><span>${esc(s.label)}</span><span class="cnt">${items.length} · ${inr(items.reduce((a,d)=>a+(d.value||0),0))}</span></div>
      <div class="kcol-b">${items.map(d => { const stale = hoursSince(d.updatedAt) > 21*24;
        return `<div class="kcard" data-action="openDeal" data-id="${d.id}">
          <div class="kv1"><span>${esc(d.buyer)}${stale ? '<span class="stale-dot" title="stale — no update in 21+ days"></span>' : ''}</span><span>${inr(d.value)}</span></div>
          <div class="kv2"><span>${esc(projNm(d.projectId))}</span><span>${esc(agentNm(d.agentId).split(' ')[0])}</span></div></div>`; }).join('')}</div></div>`; }).join('')}</div>`;
}};

PAGES.inventory = { async render(root, p, seq){

  let view = p.view || 'map';
  const STS = ['Available','Hold','Token','Booked','Agreement','Registered','Sold','Unavailable'];
  const statusDn = charts.donut(STS.filter(s => allUnits.some(u => u.status === s)).map(s => ({ label: s, value: allUnits.filter(u => u.status === s).length, color: STATUS_COLORS[s], tip: allUnits.filter(u => u.status === s).length + ' units' })), 126, 14, { v: allUnits.length, l: 'units' });
  const prices = allUnits.map(u => u.price || 0).filter(v => v > 0);

      <span id="invCount" style="color:var(--ink3);font-size:12px;margin-left:auto"></span>
    </div>
    <div class="grid g3">
      ${card('Status mix', `<div class="duo">${statusDn.svg}<div>${statusDn.legend}</div></div>`, { sub: esc(pr.name) + ' · whole project' })}
      ${card('Price distribution', priceBars, { sub: 'all units by asking price' })}
      ${card('Avg rate by configuration', rateBars, { sub: '₹ per sq.ft. carpet' })}
    </div>
    <div id="invBody"></div>`;

    const statusF = $('#invStatus').value;

        <div class="legend">${['Available','Hold','Token','Booked','Agreement','Registered','Sold','Unavailable'].map(s => `<span><i class="s-${s}" style="display:inline-block"></i>${s}</span>`).join('')}</div></div>`;

        <tbody>${inv.map(u => `<tr data-action="openUnit" data-id="${u.id}">

          <td>${esc(u.config)}${u.exclusive ? ' <span class="chip c-teal">Excl.</span>' : ''}</td>

PAGES.marketing = { async render(root, p, seq){
  const rolls = (await marketingService.getRollups()).sort((a,b) => (b.rollup.revenue || 0) - (a.rollup.revenue || 0));
  if (seq !== renderSeq) return;
  const tot = marketingService.getTotals(rolls.map(r => r.rollup));
  const steps = [['Spend', inr(tot.spend)], ['Leads', tot.leads.toLocaleString('en-IN')], ['Qualified', tot.qualified], ['Site visits', tot.visits], ['Deals', tot.deals], ['Closed', tot.closed], ['Revenue', inr(tot.revenue)]];
  const widths = [1, .92, .7, .52, .36, .26, .2];
  const colors = ['#57524A','#57524A','#4E6E5F','#4E6E5F','#2F7355','#1F6B4D','#155038'];
  const roiItems = rolls.filter(r => r.rollup.commission > 0 || r.rollup.spend > 0).sort((a, b) => (b.rollup.roi || 0) - (a.rollup.roi || 0)).map(r => {
    const u = r.rollup, roi = u.roi;
    return { l: r.source, v: roi || .01, tip: u.spend ? (roi * 100).toFixed(0) + '% · ' + inr(u.commission) + ' on ' + inr(u.spend) : 'organic · ' + inr(u.commission), c: !u.spend ? '#1B6E77' : roi >= 2 ? '#155038' : roi >= 1 ? '#1F6B4D' : roi > 0 ? '#C8922B' : '#B23A2E' };
  });
  const effPts = rolls.filter(r => r.rollup.spend > 0 && r.rollup.leads > 0).map(r => { const u = r.rollup;
    return { x: u.cpl, y: u.closed, r: u.leads, color: (u.roi || 0) >= 1 ? '#1F6B4D' : '#B23A2E',
      tip: `${r.source} · CPL ${inr(u.cpl)} · ${u.closed} closures · ${u.deals} deals · ${(u.roi * 100).toFixed(0)}% ROI` }; });
  let expanded = null;
  root.innerHTML = `
    ${pageHead('Performance', 'Marketing', `Spend → lead → visit → deal → revenue attribution from <span class="mono">marketing_sources / marketing_campaigns</span>. ROI shows “—” where cost data is absent — never fabricated.`)}
    <div class="row2">
      ${card('Funnel', `<div class="funnel">${steps.map((s,i) => {
        const conv = i > 0 && steps[i-1][1] !== 0 ? `<div class="fconv">${icon('chevR',12)} ${typeof steps[i-1][1] === 'number' && typeof s[1] === 'number' && +steps[i-1][1] ? ((s[1]/steps[i-1][1]*100).toFixed(0) + '% conversion') : ''}</div>` : '';
        return (i > 0 ? conv : '') + `<div class="fstep" style="width:${(widths[i]*100).toFixed(0)}%;min-width:300px;max-width:640px;background:${colors[i]}"><span>${s[0]}</span><span>${s[1]}</span></div>`; }).join('')}</div>`, { sub: 'aggregate across all sources' })}
      ${card('Cost efficiency', (() => {
        const best = [...rolls].filter(r => r.rollup.closed > 0).sort((a,b) => (a.rollup.cpa||9e9) - (b.rollup.cpa||9e9))[0];
        const worst = [...rolls].filter(r => r.rollup.spend > 0).sort((a,b) => (b.rollup.cpl||0) - (a.rollup.cpl||0))[0];
        const organic = rolls.filter(r => !r.rollup.spend && r.rollup.revenue > 0).sort((a,b)=>b.rollup.revenue-a.rollup.revenue).slice(0,3);
        return `<div class="d-sec"><div class="st">Best acquisition</div>${best ? `<div class="kv"><span class="k">${esc(best.source)}</span><span class="v">CPA ${inr(best.rollup.cpa)} · ${best.rollup.closed} closures</span></div>` : '<div class="cellsub">No closures recorded yet.</div>'}</div>
        <div class="d-sec"><div class="st">Watchlist</div>${worst ? `<div class="kv"><span class="k">${esc(worst.source)}</span><span class="v">CPL ${inr(worst.rollup.cpl)} · ${worst.rollup.closed} closures</span></div>` : '<div class="cellsub">No spend data.</div>'}</div>
        <div class="d-sec"><div class="st">Best organic channels</div>${organic.map(r => `<div class="kv"><span class="k">${esc(r.source)}</span><span class="v">${inr(r.rollup.revenue)} revenue</span></div>`).join('') || '<div class="cellsub">—</div>'}</div>`;
      })(), { sub: 'computed from campaign rollups' })}
    </div>
    <div class="row2">
      ${card('ROI by source', charts.hbars(roiItems), { sub: 'commission returned per rupee of spend · teal = organic' })}
      ${card('Cost per lead vs closures', charts.scatter(effPts, { xlabel: 'cost per lead', xfmt: f => inr(f), yfmt: f => Math.round(f) }), { sub: 'bubble size = leads · green = ROI ≥ 100%' })}
    </div>
    <div class="card" style="padding:0"><div class="tblwrap"><table class="tbl" style="min-width:1080px">
      <thead><tr><th>Source / Campaign</th><th class="num">Spend</th><th class="num">Leads</th><th class="num">Qualified</th><th class="num">Visits</th><th class="num">Deals</th><th class="num">Closed</th><th class="num">Revenue</th><th class="num">Commission</th><th class="num">CPL</th><th class="num">CPA</th><th class="num">ROI</th></tr></thead>
      <tbody id="mktBody"></tbody></table></div>
      ${rolls.length ? '' : empty('No marketing data found', 'Populate marketing_sources and marketing_campaigns.')}</div>`;
  const draw = () => {
    $('#mktBody').innerHTML = rolls.map(r => {
      const u = r.rollup;
      return `<tr data-action="mktToggle" data-source="${esc(r.source)}" style="font-weight:600">
        <td><span style="display:inline-flex;gap:7px;align-items:center;cursor:pointer">${icon('chevR',13)} ${esc(r.source)}</span></td>
        <td class="num">${u.spend ? inr(u.spend) : '—'}</td><td class="num">${u.leads}</td><td class="num">${u.qualified}</td><td class="num">${u.visits}</td>
        <td class="num">${u.deals}</td><td class="num">${u.closed}</td><td class="num">${inr(u.revenue)}</td><td class="num">${inr(u.commission)}</td>
        <td class="num">${u.cpl ? inr(u.cpl) : '—'}</td><td class="num">${u.cpa ? inr(u.cpa) : '—'}</td>
        <td class="num">${u.spend ? chip((u.roi*100).toFixed(0) + '%', u.roi >= 2 ? 'c-green-d' : u.roi >= 1 ? 'c-green' : 'c-red') : chip('organic', 'c-teal')}</td></tr>` +

PAGES.tasks = { async render(root, p, seq){

  const isToday = iso => iso && new Date(iso).toLocaleDateString('en-IN', { timeZone: IST }) === NOW.toLocaleDateString('en-IN', { timeZone: IST });

  const pending = tasks.filter(t => t.status === 'Pending');
  const typeDn = charts.donut([...new Set(pending.map(t => t.type))].map((ty, i) => ({ label: ty, value: pending.filter(t => t.type === ty).length, color: CHART_COLORS[i % 6] })), 132, 15, { v: pending.length, l: 'open' });

  const odItems = Object.entries(odAgents).sort((a, b) => b[1] - a[1]).map(([id, n]) => ({ l: agentNm(id), v: n, tip: n + ' overdue', c: '#B23A2E', act: `data-action="openAgent" data-id="${id}"` }));

    return `<div class="taskgrp card" style="padding:0"><div class="card-h" style="padding:13px 16px 8px"><div class="card-t">${title} <span class="chip ${tone}">${list.length}</span></div></div>
    ${list.map(t => `<div class="taskrow">
      <input type="checkbox" style="width:16px;height:16px;accent-color:var(--accent);cursor:pointer" data-change="taskDone" data-id="${t.id}" ${t.status === 'Completed' ? 'checked' : ''}>
      <span class="chip c-gray" style="min-width:74px;justify-content:center">${esc(t.type)}</span>
      <div style="flex:1;min-width:0;cursor:pointer" data-action="openLead" data-id="${t.leadId || ''}"><div class="cellstrong" style="${t.status === 'Completed' ? 'text-decoration:line-through;color:var(--ink3)' : ''}">${esc(t.title)}</div>
      ${t.leadId ? `<div class="cellsub">${esc(leadNm(t.leadId))}</div>` : ''}</div>
      <span style="font-size:12px;color:var(--ink2)">${esc(agentNm(t.agentId).split(' ')[0])}</span>
      <span style="font-size:12px;color:var(--ink3);width:80px;text-align:right" class="${t.dueAt && new Date(t.dueAt) < NOW && t.status === 'Pending' ? 'ovd' : ''}">${isToday(t.dueAt) ? 'Today' : fmtDate(t.dueAt)}</span>

    </div>`).join('')}</div>`; };

    ${pageHead('Operations', 'Tasks & Follow-ups', `Calls, WhatsApp follow-ups, visits, documentation and payment chasers.${demoMode() ? '' : ' Live from the tasks table — overdue states come from due_at in the database.'}`,
      `<button class="btn" data-action="newTask">${icon('plus',14)} New task</button>`)}
    <div class="row2">
      ${card('Open tasks by type', pending.length ? `<div class="duo">${typeDn.svg}<div>${typeDn.legend}</div></div>` : empty('No open tasks'), { sub: 'pending only' })}

/* delegated events — every mutation goes through services */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (t && Actions[t.dataset.action]){ e.preventDefault(); $$('.pop').forEach(p => p.remove()); Actions[t.dataset.action](t.dataset, t, e); }
});
document.addEventListener('change', async e => {
  const t = e.target.closest('[data-change]'); if (!t) return;
  const { change: c, id } = t.dataset;
  if (c === 'leadStage'){ await leadService.updateLead(id, { stage:t.value }); toast('Stage updated — ' + pipelineService.stage(t.value).label); closeDrawer(); refresh(); renderBadges(); }
  if (c === 'leadAgent'){ await leadService.updateLead(id, { agentId:t.value || null }); toast(t.value ? 'Lead assigned' : 'Lead unassigned' + (prodMode() ? ' — lead_assignments row written' : '')); renderBadges(); }
  if (c === 'dealStage'){ await dealService.updateDealStage(id, t.value); toast('Deal stage → ' + pipelineService.stage(t.value).label); closeDrawer(); refresh(); }
  if (c === 'agentRole'){ await agentService.updateRole(id, t.value); toast('Role updated (frontend hint — RLS enforces real permissions)'); }
  if (c === 'taskDone'){ await taskService.setStatus(id, t.checked ? 'Completed' : 'Pending'); toast(t.checked ? 'Task completed' : 'Task reopened'); refresh(); }
});

/* ---- form error surface + busy state ---- */
function clearFormError(form){ const el = form && form.querySelector('.form-err'); if (el) el.remove(); }
function showFormError(form, msg){
  if (!form) return;
  clearFormError(form);
  const el = document.createElement('div');
  el.className = 'form-err';
  el.style.cssText = 'color:var(--red);font-size:12.5px;line-height:1.5;margin:12px 0 0;padding:9px 12px;background:var(--red-bg);border:1px solid var(--red-bd);border-radius:8px;word-break:break-word';
  el.textContent = msg;                       // textContent, never innerHTML, for error text
  form.prepend(el);
  el.scrollIntoView({ block: 'nearest' });
}
async function guardForm(form, fn){
  const btn = form.querySelector('[type="submit"]'); const orig = btn ? btn.innerHTML : '';
  clearFormError(form);
  try {
    if (btn){ btn.disabled = true; btn.innerHTML = icon('refresh',13) + ' Saving…'; }
    await fn();
    return true;
  } catch(err){
    if (btn){ btn.disabled = false; btn.innerHTML = orig; }
    showFormError(form, (err && err.message) || 'Request failed');   // the exact Supabase/PostgREST message
    return false;
  }
}

document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  const fd = Object.fromEntries(new FormData(f).entries()); const kind = f.dataset.form;

  if (kind === 'authSetup'){
    const btn = $('#authSubmit'); btn.disabled = true; btn.textContent = 'Connecting…';
    try { await authService.connect(fd.url, fd.key); } catch(err){ renderLoginScreen('setup', err.message || 'Connection failed'); }
    return;
  }
  if (kind === 'authLogin'){
    const btn = $('#authSubmit'); btn.disabled = true; btn.textContent = 'Signing in…';
    try { await authService.signIn(fd.email, fd.password); } catch(err){ renderLoginScreen('login', err.message || 'Sign-in failed'); }
    return;
  }
  if (kind === 'lead'){
    await guardForm(f, async () => {
      const created = await leadService.createLead({
        name: fd.name.trim(), phone: fd.phone.trim(), city: fd.city || 'Gurugram', locality: fd.locality || '',
        source: fd.source, agentId: fd.agentId || null, visitCount: 0,
        req: { purpose: fd.purpose, propertyClass: 'Residential', prefLocality: fd.locality || '',
          propertyType: fd.propertyType, config: '', budgetMin: +fd.budgetMin || null, budgetMax: +fd.budgetMax || null },
        notes: fd.notes || '',
      });
      // built-in round-trip verification: re-read the row from the database
      if (prodMode()){
        const check = await leadService.getLead(created.id);
        if (!check || !check.id) throw new Error('Insert succeeded but the lead could not be re-read — check the RLS SELECT policy on leads (the row exists).');
      }
      // UI-only enrichment: form details with no matching leads columns — visible this session, not persisted
      created.req = { ...created.req, purpose: fd.purpose, propertyType: fd.propertyType, budgetMin: +fd.budgetMin || null, budgetMax: +fd.budgetMax || null };
      created.notes = fd.notes || '';
      closeModal(); toast('Lead created' + (prodMode() ? ' — verified in Supabase' : ''));
      renderBadges(); refresh();
    });
    return;
  }
  if (kind === 'visit'){
    await guardForm(f, async () => {
      const proj = await projectService.getProject(fd.projectId).catch(() => null);
      await siteVisitService.createVisit({ leadId: fd.leadId, agentId: fd.agentId, projectId: fd.projectId,
        date: new Date(fd.date + 'T09:00').toISOString(), time: fd.time, siteContact: fd.siteContact || '', location: proj?.address || '', notes: '' });
      closeModal(); toast('Site visit scheduled'); renderBadges(); refresh();
    });
    return;
  }
  if (kind === 'task'){
    await guardForm(f, async () => {
      await taskService.createTask({ type: fd.type, title: fd.title, leadId: fd.leadId || null, agentId: fd.agentId,
        dueAt: new Date(fd.date + 'T10:00').toISOString(), priority: fd.priority, notes: fd.notes || '' });
      closeModal(); toast('Task created'); refresh();
    });
    return;
  }
  if (kind === 'visitOutcome'){
    await guardForm(f, async () => {
      await siteVisitService.completeVisit(f.dataset.id, fd.outcome, +fd.followUpDays);
      closeModal(); toast('Visit outcome recorded'); renderBadges(); refresh();
    });
    return;
  }
  if (kind === 'org'){
    await guardForm(f, async () => {
      await organizationService.update({ name: fd.name, city: fd.city, gstin: fd.gstin });
      App.org = await organizationService.getOrganization();
      closeModal(); toast('Organization saved' + (prodMode() ? ' — written to organizations' : ' (demo)')); renderShell(); refresh();
    });
    return;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closeModal(); closeDrawer(); $('#sres') && ($('#sres').style.display = 'none'); }
  if ((e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) && !/input|textarea|select/i.test(document.activeElement.tagName)){
    e.preventDefault(); $('#gsearch') && $('#gsearch').focus();
  }
});

/* ============================== BOOT ============================== */
(async function boot(){
  await authService.init();
})();
</script>
</body>
</html>
