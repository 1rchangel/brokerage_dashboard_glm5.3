<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Meridian — Real-Estate Operating System</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231C1A16'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23C9A24B' stroke-width='2'/%3E%3Cpath d='M16 4v24' stroke='%23C9A24B' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F1E9; --paper2:#ECE8DC; --paper3:#FBFAF5;
  --ink:#1C1A16; --ink2:#4C473C; --ink3:#8B8574;
  --line:#DFDACB; --lineS:#C9C2AE;
  --green:#1D4D36; --greenT:#DFE8DD;
  --brass:#A8842C; --brassT:#F0E6C8;
  --red:#A33B2E; --redT:#F0DDD6;
  --amber:#7A5B14;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font:14px/1.5 'Archivo',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper3);border:1px solid var(--lineS);border-radius:8px;padding:9px 12px;width:100%;outline:none;transition:border-color .15s, box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brass);box-shadow:0 0 0 3px rgba(168,132,44,.14)}
textarea{resize:vertical;min-height:72px}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:14px 0 6px}
.ic{flex:none;display:inline-block;vertical-align:-3px}
.serif{font-family:'Fraunces',serif}
.tnum{font-variant-numeric:tabular-nums}
::selection{background:var(--brassT)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--lineS);border-radius:6px;border:2px solid var(--paper)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:234px 1fr;height:100vh}
.side{background:var(--ink);color:#CFC9B8;display:flex;flex-direction:column;padding:18px 0 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 20px 18px;color:var(--paper)}
.brand b{font-family:'Fraunces',serif;font-weight:500;font-size:19px;letter-spacing:.14em}
.nav{flex:1}
.nav-sec{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#6E6857;padding:16px 20px 6px}
.nav-i{display:flex;align-items:center;gap:11px;width:100%;padding:9px 20px;font-size:13.5px;font-weight:500;color:#B9B29E;border-left:2px solid transparent;text-align:left;transition:.15s}
.nav-i:hover{color:var(--paper);background:rgba(244,241,233,.05)}
.nav-i.on{color:var(--paper);border-left-color:var(--brass);background:rgba(244,241,233,.07)}
.side-foot{border-top:1px solid #33302A;padding:12px 16px 2px;display:flex;align-items:center;gap:10px}
.side-foot .who{flex:1;min-width:0}
.side-foot .who b{display:block;color:var(--paper);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .who span{font-size:11px;color:#8B8574;text-transform:capitalize}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--paper);flex:none}
.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{height:58px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;background:var(--paper);position:relative;z-index:30}
.cmd{position:relative;flex:1;max-width:560px}
.cmd input{background:var(--paper2);border-color:transparent;border-radius:9px;padding:9px 14px 9px 38px}
.cmd input:focus{background:var(--paper3);border-color:var(--brass)}
.cmd>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}
.cmd kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 10.5px 'Archivo';color:var(--ink3);border:1px solid var(--lineS);border-radius:5px;padding:2px 6px;background:var(--paper3)}
.cmd-pop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--paper3);border:1px solid var(--lineS);border-radius:12px;box-shadow:0 18px 50px rgba(28,26,22,.18);max-height:60vh;overflow:auto;z-index:50;padding:6px}
.cmd-sec{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);padding:10px 12px 4px}
.cmd-i{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:8px;text-align:left}
.cmd-i .sub{color:var(--ink3);font-size:12px;margin-left:auto;white-space:nowrap}
.cmd-i.sel{background:var(--paper2)}
.ans-h{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--brass);padding:10px 12px 2px}
.ans-big{font-family:'Fraunces',serif;font-size:26px;font-weight:500;padding:2px 12px 0}
.ans-p{font-size:12.5px;color:var(--ink2);padding:0 12px 8px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.bell{position:relative;width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:1px solid transparent}
.bell:hover{background:var(--paper2)}
.bell .cnt{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.userchip{display:flex;align-items:center;gap:9px;padding:4px 6px 4px 4px;border-radius:10px}
.userchip .nm{text-align:right;line-height:1.2}
.userchip .nm b{display:block;font-size:12.5px}
.userchip .nm span{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em}
.pop{position:absolute;top:calc(100% + 8px);right:0;width:360px;background:var(--paper3);border:1px solid var(--lineS);border-radius:12px;box-shadow:0 18px 50px rgba(28,26,22,.18);z-index:50;overflow:hidden}
.pop-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.pop-h button{font-size:11.5px;font-weight:600;color:var(--green)}
.notif{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.notif:last-child{border-bottom:none}
.notif.unread{background:#F7F3E6}
.notif .t{color:var(--ink3);font-size:11px;white-space:nowrap;margin-left:auto}
.notif-ic{width:28px;height:28px;border-radius:8px;background:var(--paper2);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}

#view{flex:1;overflow-y:auto;padding:26px 30px 70px}
#view .pg{max-width:1240px;margin:0 auto;animation:pgIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pg-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.pg-head h1{font-family:'Fraunces',serif;font-weight:500;font-size:29px;letter-spacing:.01em}
.pg-head .sub{color:var(--ink3);font-size:13px;margin-top:3px}
.h-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;font:600 13px 'Archivo';padding:9px 15px;border-radius:9px;border:1px solid transparent;transition:.15s;white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.pri:hover{background:var(--green)}
.btn.grn{background:var(--green);color:#fff}
.btn.grn:hover{background:#16402C}
.btn.sec{border-color:var(--lineS);background:var(--paper3)}
.btn.sec:hover{border-color:var(--ink3)}
.btn.gho{color:var(--ink2);padding:8px 10px}
.btn.gho:hover{background:var(--paper2);color:var(--ink)}
.btn.dng{background:var(--red);color:#fff}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pl-neut{background:#E9E5D8;color:#5C574B}.pl-pos{background:var(--greenT);color:var(--green)}
.pl-warn{background:var(--brassT);color:var(--amber)}.pl-dang{background:var(--redT);color:var(--red)}
.pl-info{background:#E2E4DA;color:#3F4A38}
.sev-hi{background:var(--redT);color:var(--red)}.sev-med{background:var(--brassT);color:var(--amber)}.sev-low{background:#E4E2D6;color:#5C574B}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:9px 12px;border-bottom:1px solid var(--lineS)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
.tbl .r{text-align:right}
.tbl tr.row:hover td{background:#EFEBDF;cursor:pointer}
.tbl tr:hover td.act-plain{background:#EFEBDF}
.empty{padding:46px 20px;text-align:center;color:var(--ink3)}
.empty p{margin-top:4px;font-size:13px}
.ruled{border-top:1px solid var(--lineS);margin-top:26px;padding-top:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sec-h h2{font-family:'Fraunces',serif;font-weight:500;font-size:18px}
.mini{font-size:12px;color:var(--ink3)}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;background:var(--paper2);border:1px solid var(--line);border-radius:7px;padding:10px 12px;overflow-x:auto;white-space:pre;color:var(--ink2)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;font-size:13px}
.facts div{padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.facts span{color:var(--ink3)}
.score-bar{width:64px;height:5px;background:#E1DCCB;border-radius:3px;display:inline-block;vertical-align:middle;margin-right:8px;overflow:hidden}
.score-bar i{display:block;height:100%;border-radius:3px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

/* ---------- ledger strip / dashboard ---------- */
.ledger{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(178px,1fr);border-top:1px solid var(--lineS);border-bottom:1px solid var(--lineS);overflow-x:auto;margin-bottom:26px}
.lg{text-align:left;padding:18px 20px 16px;border-left:1px solid var(--line);transition:.15s}
.lg:first-child{border-left:none}
.lg:hover{background:#EFEBDF}
.lg .l{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.lg .v{display:block;font-family:'Fraunces',serif;font-weight:500;font-size:29px;margin:5px 0 3px;font-variant-numeric:tabular-nums}
.lg .s{display:block;font-size:12px;color:var(--ink3)}
.lg .s b{color:var(--green);font-weight:600}
.lg .s b.down{color:var(--red)}
.dash-grid{display:grid;grid-template-columns:1.9fr 1fr;gap:34px;align-items:start}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--lineS);padding-bottom:9px;margin-bottom:6px}
.panel-h h2{font-family:'Fraunces',serif;font-weight:500;font-size:17px}
.chart{position:relative}
.chart-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:7px;transform:translate(-50%,-130%);white-space:nowrap;display:none;z-index:5}
.fbar{display:grid;grid-template-columns:96px 1fr 78px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.fbar:last-child{border-bottom:none}
.fbar .track{height:9px;background:#E7E2D2;border-radius:5px;overflow:hidden}
.fbar .track i{display:block;height:100%;background:var(--green);border-radius:5px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.fbar .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.fbar.click{cursor:pointer}.fbar.click:hover{background:#EFEBDF}
.ins{display:flex;gap:11px;width:100%;text-align:left;padding:12px 6px;border-bottom:1px solid var(--line);align-items:flex-start}
.ins:hover{background:#EFEBDF}
.ins b{font-size:13.5px;display:block}
.ins p{font-size:12px;color:var(--ink2);margin-top:2px}
.ins .ic{color:var(--ink3);margin-top:2px}
.task{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px}
.task:last-child{border:none}
.task .due{margin-left:auto;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.task.over .due{color:var(--red);font-weight:600}
.ck{width:18px;height:18px;border:1.5px solid var(--lineS);border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;color:transparent}
.ck:hover{border-color:var(--green)}
.ck.done{background:var(--green);border-color:var(--green);color:#fff}
.actfeed{font-size:12.5px}
.actfeed .a{display:flex;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
.actfeed .a:last-child{border:none}
.actfeed .t{color:var(--ink3);font-size:11px;white-space:nowrap;margin-left:auto}
.trio{display:grid;grid-template-columns:1fr 1.5fr 1.1fr;gap:34px;margin-top:34px}

/* ---------- tables / kanban ---------- */
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.filters input{max-width:250px}
.filters select{width:auto;min-width:130px}
.stage-legend{display:flex;gap:6px;margin:4px 0 16px;flex-wrap:wrap}
.kb{display:grid;grid-template-columns:repeat(6,minmax(238px,1fr));gap:13px;overflow-x:auto;align-items:start;padding-bottom:8px}
.kb-col{background:var(--paper2);border:1px solid var(--line);border-radius:13px;padding:10px;min-height:180px;transition:.15s}
.kb-col.over{outline:2px dashed var(--green);outline-offset:-2px;background:#E6E3CE}
.kb-col.flash{outline:2px solid var(--brass)}
.kb-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.kb-h .c{color:var(--ink3)}
.kb-card{background:var(--paper3);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:9px;cursor:grab}
.kb-card:hover{border-color:var(--lineS);box-shadow:0 3px 12px rgba(28,26,22,.07)}
.kb-card.dragging{opacity:.35}
.kb-card b{font-size:13.5px;display:block}
.kb-card .prop{font-size:11.5px;color:var(--ink3);margin:1px 0 7px}
.kb-card .val{font-family:'Fraunces',serif;font-size:16.5px;font-weight:500}
.kb-foot{display:flex;align-items:center;gap:8px;margin-top:8px}
.age{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:#E9E5D8;color:#5C574B}
.age.warn{background:var(--brassT);color:var(--amber)}

/* ---------- drawer / modal / toast ---------- */
#layer .backdrop{position:fixed;inset:0;background:rgba(24,21,15,.38);opacity:0;transition:.25s;z-index:55}
#layer.on .backdrop{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:508px;max-width:96vw;background:var(--paper);border-left:1px solid var(--lineS);box-shadow:-30px 0 70px rgba(20,18,12,.16);transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:60;display:flex;flex-direction:column}
#layer.on .drawer{transform:none}
.dw-h{padding:20px 24px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.dw-h h3{font-family:'Fraunces',serif;font-weight:500;font-size:21px;line-height:1.2}
.dw-b{flex:1;overflow-y:auto;padding:20px 24px 40px}
.dw-x{margin-left:auto}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-46%) scale(.97);opacity:0;width:480px;max-width:94vw;max-height:88vh;overflow-y:auto;background:var(--paper);border:1px solid var(--lineS);border-radius:16px;box-shadow:0 30px 80px rgba(20,18,12,.3);z-index:70;padding:24px;transition:.22s cubic-bezier(.2,.8,.2,1)}
#layer.on .modal{transform:translate(-50%,-50%) scale(1);opacity:1}
.modal h3{font-family:'Fraunces',serif;font-weight:500;font-size:20px;margin-bottom:4px}
.modal .m-sub{font-size:12.5px;color:var(--ink3);margin-bottom:6px}
.m-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}
.form-err{display:none;background:var(--redT);color:var(--red);font-size:12.5px;font-weight:600;border-radius:8px;padding:9px 12px;margin-top:14px}
.form-err.on{display:block}
#toasts{position:fixed;right:20px;bottom:20px;z-index:95;display:flex;flex-direction:column;gap:9px}
.toast{background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:11px;display:flex;gap:10px;align-items:center;max-width:380px;font-size:13px;box-shadow:0 12px 30px rgba(20,18,12,.3);animation:tIn .25s cubic-bezier(.2,.8,.2,1)}
.toast.err{background:var(--red)}
.toast.info{background:var(--green)}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}
@keyframes tIn{from{opacity:0;transform:translateY(10px)}to{opacity:1}}

/* ---------- login ---------- */
.login{display:grid;grid-template-columns:1.05fr 1fr;height:100vh}
.lg-left{background:var(--ink);color:#CFC9B8;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:44px 52px}
.lg-left .wordmark{display:flex;align-items:center;gap:12px;color:var(--paper)}
.lg-left .wordmark b{font-family:'Fraunces',serif;font-weight:500;font-size:23px;letter-spacing:.2em}
.lg-copy{margin-top:auto;position:relative;z-index:2}
.lg-copy h1{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(30px,3.4vw,46px);line-height:1.12;color:var(--paper);max-width:12em}
.lg-copy p{margin-top:14px;max-width:34em;font-size:14px;color:#A29B85}
.arches{position:absolute;right:-60px;bottom:-30px;opacity:.9;z-index:1}
.lg-right{display:flex;align-items:center;justify-content:center;padding:40px}
.lg-card{width:380px;max-width:100%}
.lg-card h2{font-family:'Fraunces',serif;font-weight:500;font-size:25px}
.demo-chips{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:600;border:1px solid var(--lineS);border-radius:20px;padding:5px 12px;color:var(--ink2);background:var(--paper3)}
.chip:hover{border-color:var(--brass);color:var(--ink)}
.sec-note{margin-top:22px;font-size:11.5px;color:var(--ink3);display:flex;gap:7px;align-items:flex-start}

.wh-stat{display:flex;gap:26px;padding:6px 0 16px}
.wh-stat div b{font-family:'Fraunces',serif;font-size:22px;font-weight:500;display:block}
.code-row{display:flex;gap:8px;align-items:center;margin:8px 0 4px}
.code-row .mono{flex:1;overflow:hidden;text-overflow:ellipsis}
.svc{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line)}
.svc:last-child{border:none}
.svc .ic{color:var(--ink2)}
.svc b{font-size:13.5px;display:block}
.svc p{font-size:12px;color:var(--ink3)}
.svc .right{margin-left:auto;display:flex;align-items:center;gap:10px}

.denied{max-width:440px;margin:60px auto;text-align:center}
.denied .ic{color:var(--red)}
.denied h1{font-family:'Fraunces',serif;font-size:26px;font-weight:500;margin:12px 0 6px}

@media (max-width:1120px){
  .app{grid-template-columns:64px 1fr}
  .brand b,.nav-i span,.nav-sec,.side-foot .who{display:none}
  .nav-i{justify-content:center;padding:11px 0}
  .dash-grid,.trio{grid-template-columns:1fr;gap:24px}
  .cmd kbd{display:none}
}
@media (max-width:760px){
  #view{padding:18px 14px 60px}
  .userchip .nm{display:none}
  .login{grid-template-columns:1fr}.lg-left{display:none}
  .drawer{width:100vw}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div id="toasts"></div>

<script>
/* ============================================================

/* ============================================================
   3 · AUTH · SESSION · PERMISSIONS
============================================================ */
const cur=()=>db?db.users.find(u=>SESSION&&u.id===SESSION.uid):null;
const isMgr=u=>u&&u.role!=='agent';
const ROLE_PERMS={admin:['lead','property','deal','visit','team.view','com.view.all','integrations','security.log','export','analytics.org','webhook','task'],
                  agent:['lead.create','lead.edit.own','deal.create','deal.move.own','visit','com.view.own','analytics.own','task']};
function can(u,p){
  if(!u||!p)return !!u;
  if(u.role==='owner')return true;
  if(!u.active)return false;
  return (ROLE_PERMS[u.role]||[]).some(x=>p===x||p.startsWith(x+'.'));
}
function checkSession(){
  if(!SESSION)return false;
  if(now()>SESSION.exp){doLogout('Your session expired for security. Please sign in again.');return false}
  const u=cur();
  if(!u||!u.active){doLogout('Your account is no longer active.');return false}
  SESSION.exp=now()+30*60e3; localStorage.setItem(SESS_KEY,JSON.stringify(SESSION));
  return true;
}
function doLogout(msg){
  SESSION=null;localStorage.removeItem(SESS_KEY);closeLayer(true);
  if(msg)toast(msg,'info');
  renderApp();
}
function guard(perm){
  if(!checkSession())throw{user:'Your session has ended. Please sign in again.'};
  const u=cur();
  if(!can(u,perm)){
    logSec('authz.denied','high',u.email,`Denied: ${perm} (${u.role})`);
    throw{user:'You do not have permission to perform this action.'};
  }
  return u;
}
function ownOrManage(u,ownerId,what){
  if(isMgr(u))return;
  if(ownerId!==u.id){logSec('authz.denied','high',u.email,`Agent access to another agent's ${what}`);throw{user:'This record belongs to another agent.'}}
}

const PROP_STATUS={available:'Available',under_offer:'Under offer',sold:'Sold'};
const TIMELINES=['ASAP','1-3 months','3-6 months','Just exploring'];
const SOURCES=['Referral','Zillow Portal','Website','Instagram','Walk-in','Webhook'];
const LOST_REASONS=['Priced out','Chose another property','Financing fell through','Changed plans','Other'];

function scoreLead(l){
  const avg=db.properties.filter(p=>p.orgId===l.orgId).reduce((a,p)=>a+p.price,0)/(db.properties.length||1);
  const f={};
  f.budget=clamp(Math.round((l.budgetMax/(avg*1.4))*30),2,30);
  f.timeline={'ASAP':25,'1-3 months':18,'3-6 months':11,'Just exploring':5}[l.timeline]??8;
  const days=l.lastContactAt?Math.floor((now()-l.lastContactAt)/DAY):45;
  const rec=days<=3?15:days<=7?11:days<=14?7:days<=30?3:0;
  const acts=db.activities.filter(a=>a.entity==='lead'&&a.entityId===l.id).length;
  f.engagement=Math.min(25,rec+Math.min(10,acts*2));
  f.source={'Referral':15,'Webhook':12,'Zillow Portal':11,'Website':10,'Walk-in':8,'Instagram':7}[l.source]??8;
  f.profile=(l.email?2:0)+(l.phone?3:0)+(l.budgetMax?3:0)+(l.notes?2:0);
  return{total:clamp(Object.values(f).reduce((a,b)=>a+b,0),0,100),factors:f};
}
function rescore(l){const s=scoreLead(l);l.score=s.total;l.scoreF=s.factors;return l}
function createLead(data,byUser){
  const l={id:uid(),orgId:cur()?.orgId||'o1',status:'new',createdAt:now(),lastContactAt:null,assignedTo:data.assignedTo||null,notes:data.notes||'',...data};
  rescore(l);
  db.leads.unshift(l);
  act(`New lead — ${l.name} (${l.source})`,{userId:byUser?.id,entity:'lead',entityId:l.id,about:l.assignedTo});
  if(l.score>=80&&l.assignedTo)notify([l.assignedTo],`${l.name} scored ${l.score}/100 — hot lead`,'lead');
  return l;
}
function scopeLeads(){const u=cur();return isMgr(u)?db.leads.filter(l=>l.orgId===u.orgId):db.leads.filter(l=>l.orgId===u.orgId&&l.assignedTo===u.id)}
function scopeDeals(){const u=cur();return isMgr(u)?db.deals.filter(d=>d.orgId===u.orgId):db.deals.filter(d=>d.orgId===u.orgId&&d.assignedTo===u.id)}
function scopeTasks(){const u=cur();return db.tasks.filter(t=>t.orgId===u.orgId&&(isMgr(u)||t.assignedTo===u.id))}
function scopeComs(){const u=cur();return db.coms.filter(c=>c.orgId===u.orgId&&(isMgr(u)||c.agentId===u.id))}
const userById=id=>db.users.find(u=>u.id===id)||{name:'Unassigned'};

function rangeFrom(k){const n=new Date();let f;
  if(k==='30d')f=now()-30*DAY;else if(k==='mtd')f=+new Date(n.getFullYear(),n.getMonth(),1);
  else if(k==='qtd')f=+new Date(n.getFullYear(),Math.floor(n.getMonth()/3)*3,1);
  else if(k==='ytd')f=+new Date(n.getFullYear(),0,1);else f=0;
  return{from:f,to:now()}}
const inR=ts=>ts>=rangeFrom(S.range).from;
function kpiData(){
  const u=cur(),deals=scopeDeals(),leads=scopeLeads(),coms=scopeComs();
  const open=deals.filter(d=>!['won','lost'].includes(d.stage));
  const won=deals.filter(d=>d.stage==='won'&&d.closedAt&&inR(d.closedAt));
  const lost=deals.filter(d=>d.stage==='lost'&&inR(d.stageChangedAt));
  const prevLen=rangeFrom(S.range).from?rangeFrom(S.range).to-rangeFrom(S.range).from:30*DAY;
  const wonPrev=deals.filter(d=>d.stage==='won'&&d.closedAt&&d.closedAt>=rangeFrom(S.range).from-prevLen&&d.closedAt<rangeFrom(S.range).from);
  const wonV=won.reduce((a,d)=>a+d.value,0),wonPrevV=wonPrev.reduce((a,d)=>a+d.value,0);
  const delta=wonPrevV?Math.round((wonV-wonPrevV)/wonPrevV*100):(wonV?100:null);
  const comR=coms.filter(c=>inR(c.at));
  const newLeads=leads.filter(l=>inR(l.createdAt)).length;
  const wr=(won.length+lost.length)?Math.round(won.length/(won.length+lost.length)*100):null;
  return{open,won,lost,wonV,delta,comR,wr,leads,newLeads,
    pipeV:open.reduce((a,d)=>a+d.value,0),
    weighted:open.reduce((a,d)=>a+d.value*STAGES[d.stage].p/100,0),
    comGross:comR.reduce((a,c)=>a+c.gross,0),
    comMine:comR.reduce((a,c)=>a+c.agentAmt,0),
    comHouse:comR.reduce((a,c)=>a+c.houseAmt,0),
    activeLeads:leads.filter(l=>!['converted','lost'].includes(l.status)).length};
}
/* ---------- AI answer engine (local rules, role-scoped) ---------- */
function aiAnswer(q){
  const t=q.toLowerCase(),u=cur(),K=kpiData();
  const row=(a,b)=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span style="color:var(--ink2)">${a}</span><b class="tnum">${b}</b></div>`;
  const wrap=(big,desc,rows)=>`<div class="ans-big">${big}</div><div class="ans-p">${desc}</div><div style="padding:0 12px 12px">${rows}</div>`;
  if(/top|best/.test(t)&&/agent|rep|team/.test(t)&&isMgr(u)){
    const rs=db.users.filter(x=>x.role==='agent').map(a=>{const w=scopeDeals().filter(d=>d.stage==='won'&&d.assignedTo===a.id);return[a.name,w.reduce((s,d)=>s+d.value,0),w.length]}).sort((a,b)=>b[1]-a[1]);
    return{title:'Top agents — all time',html:wrap(fmt$M(rs[0][1]),`${rs[0][0]} leads closed value across ${rs.reduce((s,r)=>s+r[2],0)} won deals.`,rs.map(r=>row(`${esc(r[0])} · ${r[2]} won`,fmt$M(r[1]))).join(''))};
  }
  if(/commission|payout|earn/.test(t)){
    const mine=u.role==='agent';
    return{title:`Commissions — ${RANGE_LBL[S.range]}`,html:wrap(mine?fmt$(K.comMine):fmt$(K.comGross),mine?`Your share of commission recorded in period.`:`Gross commission across the team; house share ${fmt$(K.comHouse)}.`,row('Records',K.comR.length)+row('House share',fmt$(K.comHouse))+row('Pending payout',fmt$(K.comR.filter(c=>c.status==='pending').reduce((a,c)=>a+c.agentAmt,0))))};
  }
  if(/pipeline|forecast|weighted/.test(t)){
    return{title:'Pipeline forecast',html:wrap(fmt$M(K.pipeV),`${K.open.length} open deals; probability-weighted forecast ${fmt$M(K.weighted)}.`,Object.keys(STAGES).filter(s=>!['won','lost'].includes(s)).map(s=>{const ds=K.open.filter(d=>d.stage===s);return row(`${STAGES[s].n} (${STAGES[s].p}%)`,ds.length?`${ds.length} · ${fmt$M(ds.reduce((a,d)=>a+d.value,0))}`:'—')}).join(''))};
  }
  if(/revenue|closed|won|sales/.test(t)){
    return{title:`Closed revenue — ${RANGE_LBL[S.range]}`,html:wrap(fmt$M(K.wonV),`${K.won.length} deals won${K.delta!==null?` · ${K.delta>=0?'+':''}${K.delta}% vs prior period`:''}.`,K.won.slice(0,5).map(d=>row(esc(d.title),fmt$M(d.value))).join(''))};
  }
  if(/\bhot\b|best lead/.test(t)){
    const hot=scopeLeads().filter(l=>l.score>=80&&!['converted','lost'].includes(l.status));
    return{title:'Hot leads (score ≥ 80)',html:wrap(String(hot.length),hot.length?`Highest: ${esc(hot.sort((a,b)=>b.score-a.score)[0].name)} at ${hot[0].score}/100.`:'No leads currently cross the 80 threshold.',hot.slice(0,5).map(l=>row(`${esc(l.name)} · ${esc(l.source)}`,l.score+'/100')).join(''))};
  }
  if(/overdue|follow.?up|task/.test(t)){
    const od=scopeTasks().filter(x=>!x.done&&x.dueAt<now());
    return{title:'Overdue follow-ups',html:wrap(String(od.length),od.length?'Oldest first — these are costing you conversion.':'Nothing overdue. Rare and excellent.',od.sort((a,b)=>a.dueAt-b.dueAt).slice(0,5).map(x=>row(esc(x.title),ago(x.dueAt).replace(' ago','')+' late')).join(''))};
  }
  if(/stall|stuck/.test(t)){
    const st=K.open.filter(d=>now()-d.stageChangedAt>10*DAY);
    return{title:'Stalled deals',html:wrap(String(st.length),st.length?`${fmt$M(st.reduce((a,d)=>a+d.value,0))} sitting 10+ days without stage movement.`:'Pipeline is moving well.',st.map(d=>row(esc(d.title),Math.floor((now()-d.stageChangedAt)/DAY)+'d in '+STAGES[d.stage].n)).join(''))};
  }
  if(/source/.test(t)){
    const ls=scopeLeads(),counts={};ls.forEach(l=>counts[l.source]=(counts[l.source]||0)+1);
    const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    return{title:'Leads by source',html:wrap(top[0]?top[0][0]:'—',top[0]?`${top[0][1]} of ${ls.length} leads — your strongest channel.`:'No leads yet.',top.map(s=>row(esc(s[0]),s[1])).join(''))};
  }
  if(/how many|leads/.test(t)){
    return{title:'Active leads',html:wrap(String(K.activeLeads),`${K.newLeads} new in the selected period; ${scopeLeads().filter(l=>l.score>=80).length} scoring 80+.`,'')};
  }
  return null;
}

function revChart(){
  const deals=scopeDeals(),n=new Date(),buckets=[];
  for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);buckets.push({k:d.getFullYear()+'-'+d.getMonth(),label:d.toLocaleString('en-US',{month:'short'}),v:0})}
  deals.filter(d=>d.stage==='won'&&d.closedAt).forEach(d=>{const dt=new Date(d.closedAt),k=dt.getFullYear()+'-'+dt.getMonth();const b=buckets.find(b=>b.k===k);if(b)b.v+=d.value});
  const W=620,H=200,PL=46,PR=14,PT=12,PB=26,max=Math.max(...buckets.map(b=>b.v),1);
  const x=i=>PL+i*(W-PL-PR)/5, y=v=>H-PB-(v/max)*(H-PT-PB);
  const pts=buckets.map((b,i)=>[x(i),y(b.v)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${x(5)} ${H-PB} L ${x(0)} ${H-PB} Z`;
  const grid=[0,.5,1].map(f=>{const gy=y(max*f);return`<line x1="${PL}" x2="${W-PR}" y1="${gy}" y2="${gy}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${PL-8}" y="${gy+4}" text-anchor="end" font-size="10" fill="var(--ink3)">${fmt$M(max*f)}</text>`}).join('');
  window._revPts=pts;window._revBk=buckets;
  return`<svg id="revSvg" width="100%" viewBox="0 0 ${W} ${H}" style="display:block">
    ${grid}<path d="${area}" fill="rgba(29,77,54,.09)"/><path d="${line}" fill="none" stroke="var(--green)" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--paper)" stroke="var(--green)" stroke-width="2"/>`).join('')}
    ${buckets.map((b,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--ink3)">${b.label}</text>`).join('')}
  </svg>`;
}
AFTER.dashboard=()=>{
  const svg=$('#revSvg'),tip=$('#revTip'),wrap=$('#revWrap');
  if(!svg)return;
  svg.addEventListener('mousemove',e=>{
    const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*(620/r.width);
    let bi=0,bd=1e9;window._revPts.forEach((p,i)=>{const d=Math.abs(p[0]-px);if(d<bd){bd=d;bi=i}});
    const p=window._revPts[bi],b=window._revBk[bi];
    tip.style.display='block';tip.style.left=(p[0]/620*100)+'%';tip.style.top=(p[1]/200*100)+'%';
    tip.textContent=`${b.label} — ${fmt$M(b.v)} closed`;
  });
  svg.addEventListener('mouseleave',()=>tip.style.display='none');
};
function stageBars(){
  const K=kpiData(),max=Math.max(...K.open.map(d=>d.value),1);
  return Object.keys(STAGES).filter(s=>!['won','lost'].includes(s)).map(s=>{
    const ds=K.open.filter(d=>d.stage===s),v=ds.reduce((a,d)=>a+d.value,0);
    return`<button class="fbar click" data-action="pipe.jump" data-s="${s}"><span>${STAGES[s].n}</span><span class="track"><i style="width:${v?Math.max(6,v/max*100):2}%"></i></span><span class="val tnum">${ds.length} · ${fmt$M(v)}</span></button>`;
  }).join('');
}
function sourceBars(){
  const ls=scopeLeads(),counts={};ls.forEach(l=>counts[l.source]=(counts[l.source]||0)+1);
  const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,6),max=Math.max(...top.map(t=>t[1]),1);

function insights(){
  const out=[],u=cur(),K=kpiData(),open=K.open,leads=scopeLeads(),tasks=scopeTasks();
  const stalled=open.filter(d=>now()-d.stageChangedAt>10*DAY).sort((a,b)=>a.stageChangedAt-b.stageChangedAt);
  if(stalled.length){const worst=Math.floor((now()-stalled[0].stageChangedAt)/DAY);
    out.push({k:'stalled',sev:stalled.some(d=>d.stage==='negotiation')?'hi':'md',t:`${stalled.length} deal${stalled.length>1?'s':''} stalled ${worst}+ days`,b:`${fmt$M(stalled.reduce((a,d)=>a+d.value,0))} without movement — oldest: ${stalled[0].title}.`})}
  const over=tasks.filter(t=>!t.done&&t.dueAt<now());
  if(over.length)out.push({k:'overdue',sev:'hi',t:`${over.length} overdue follow-up${over.length>1?'s':''}`,b:`Oldest: “${over.sort((a,b)=>a.dueAt-b.dueAt)[0].title}” — ${ago(over[0].dueAt)}.`});
  const lateVisits=db.visits.filter(v=>v.status==='scheduled'&&v.at<now()&&(isMgr(u)||v.agentId===u.id));
  if(lateVisits.length)out.push({k:'latevisits',sev:'md',t:`${lateVisits.length} site visit past due`,b:`${esc(userById(lateVisits[0].agentId).name)} — ${esc(db.deals.find(d=>d.id===lateVisits[0].dealId)?.title||'visit')} was scheduled ${ago(lateVisits[0].at)}.`});
  const hotNoDeal=leads.filter(l=>l.score>=80&&!['converted','lost'].includes(l.status)&&!open.some(d=>d.leadId===l.id));
  if(hotNoDeal.length)out.push({k:'hot',sev:'md',t:`${hotNoDeal.length} hot lead${hotNoDeal.length>1?'s':''} without a deal`,b:`${esc(hotNoDeal.sort((a,b)=>b.score-a.score)[0].name)} scores ${hotNoDeal[0].score}/100 — open a pipeline card.`});
  const un=leads.filter(l=>!l.assignedTo&&!['converted','lost'].includes(l.status));
  if(un.length&&isMgr(u))out.push({k:'unassigned',sev:'low',t:`${un.length} unassigned lead${un.length>1?'s':''}`,b:'Round-robin them to the team before they go cold.'});
  const sCount={};leads.forEach(l=>{if(l.source)sCount[l.source]=(sCount[l.source]||0)+1});
  const srcs=Object.entries(sCount).sort((a,b)=>b[1]-a[1]);
  if(srcs.length>1&&srcs[0][0]==='Referral')out.push({k:'sources',sev:'low',t:'Referrals dominate your book',b:`${srcs[0][1]} of ${leads.length} leads come from referrals — worth protecting that channel.`});
  return out.slice(0,5);
}

  const stages=['new','qualified','visit','negotiation','won','lost'];
  return`<div class="pg-head"><div><h1>Pipeline</h1><div class="sub">${open.length} open · ${fmt$(open.reduce((a,d)=>a+d.value,0))} · drag cards between stages</div></div>

          <b>${esc(d.title)}</b><div class="prop">${esc(db.properties.find(p=>p.id===d.propertyId)?.title||'')}</div>
          <div class="val tnum">${fmt$(d.value)}</div>
          <div class="kb-foot">${avatar(userById(d.assignedTo).name,22)}<span class="age ${days>10?'warn':''}">${days}d</span>
          ${upVisit?`<span class="age">${icon('calcheck',11)} ${fdate(upVisit.at)}</span>`:st!=='won'&&st!=='lost'?`<button class="btn gho sm" style="margin-left:auto;padding:4px 6px" data-action="visit.newForDeal" data-id="${d.id}" title="Schedule visit">${icon('calcheck',14)}</button>`:''}</div>
        </div>`}).join('')||'<div class="mini" style="text-align:center;padding:14px 0;color:var(--ink3)">Drop deals here</div>'}
    </div>`}).join('')}</div></div>`;
};
AFTER.pipeline=mountKanban;
function mountKanban(){
  let dragId=null;
  $$('.kb-card').forEach(c=>{
    c.addEventListener('dragstart',e=>{dragId=c.dataset.id;c.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
    c.addEventListener('dragend',()=>{c.classList.remove('dragging');dragId=null});
  });
  $$('.kb-col').forEach(col=>{
    col.addEventListener('dragover',e=>{if(dragId){e.preventDefault();col.classList.add('over')}});
    col.addEventListener('dragleave',()=>col.classList.remove('over'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');if(dragId)moveDeal(dragId,col.dataset.stage);dragId=null});
  });
}

    <div class="m-actions"><button type="button" class="btn sec" data-action="layer.close">Cancel</button><button class="btn dng">Mark lost</button></div></form>`)}
  d.stage=stage;d.stageChangedAt=now();
  const prop=db.properties.find(p=>p.id===d.propertyId);
  if(stage==='won'){
    d.closedAt=now();
    const gross=Math.round(d.value*d.rate/100),agent=userById(d.assignedTo);
    const agentAmt=Math.round(gross*agent.split/100);
    db.coms.unshift({id:uid(),orgId:u.orgId,dealId:d.id,agentId:d.assignedTo,gross,agentAmt,houseAmt:gross-agentAmt,status:'pending',at:now()});
    const lead=db.leads.find(l=>l.id===d.leadId);if(lead){lead.status='converted';lead.lastContactAt=now();rescore(lead)}
    if(prop)prop.status='sold';
    act(`Deal won — ${d.title} (${fmt$(d.value)}) — commission ${fmt$(gross)} gross`,{userId:u.id,about:d.assignedTo});
    const mgrs=db.users.filter(x=>isMgr(x)&&x.active).map(x=>x.id);
    if(d.assignedTo!==u.id)notify([d.assignedTo],`Congratulations — ${d.title} closed at ${fmt$(d.value)}`,'deal');
    notify(mgrs.filter(x=>x!==u.id),`Deal won — ${d.title} · gross commission ${fmt$(gross)}`,'finance');
    save();renderMain();toast(`Deal won — ${fmt$(gross)} gross commission recorded.`);
  }else{
    if(prop&&prop.status==='under_offer')prop.status='available';
    act(`${d.title} moved to ${STAGES[stage].n}`,{userId:u.id,about:d.assignedTo});
    if(d.assignedTo!==u.id)notify([d.assignedTo],`${d.title} moved to ${STAGES[stage].n}`,'deal');
    save();renderMain();toast(`Moved to ${STAGES[stage].n}.`);
  }
  const dw=$('.drawer');if(dw){const cur2=db.deals.find(x=>x.id===id);if(cur2)openDealInner(cur2)}
}
FORMS['deal.lost']=fd=>{
  const u=cur(),d=db.deals.find(x=>x.id===fd.get('id'));if(!d)return;
  ownOrManage(u,d.assignedTo,'deal');
  d.stage='lost';d.stageChangedAt=now();d.lostReason=fd.get('reason');
  const prop=db.properties.find(p=>p.id===d.propertyId);if(prop&&prop.status==='under_offer')prop.status='available';
  act(`${d.title} marked lost — ${d.lostReason}`,{userId:u.id,about:d.assignedTo});
  save();closeLayer();renderMain();toast('Deal marked lost.');
};

  const pend=coms.filter(c=>c.status==='pending').reduce((a,c)=>a+(mgr?c.gross:c.agentAmt),0);
  const paid=coms.filter(c=>c.status==='paid'&&inR(c.at)).reduce((a,c)=>a+(mgr?c.gross:c.agentAmt),0);
  return`<div class="pg-head"><div><h1>Commissions</h1><div class="sub">${RANGE_LBL[S.range]} · calculated at deal close as value × rate × agent split</div></div>
  <div class="h-actions"><div class="filters" style="margin:0">${['30d','mtd','qtd','ytd','all'].map(r=>`<button class="btn sm ${S.range===r?'pri':'sec'}" data-action="range" data-r="${r}">${{'30d':'30D','mtd':'MTD','qtd':'QTD','ytd':'YTD','all':'All'}}[r]}</button>`).join('')}</div></div></div>

FORMS['whTest']=fd=>{
  const ep=db.webhooks[0],res=$('#whRes');res.style.display='block';
  const out=(code,obj,ok)=>{res.innerHTML=`<span style="color:${ok?'var(--green)':'var(--red)'};font-weight:700">HTTP ${code}</span>  ${esc(JSON.stringify(obj))}`};
  ep.hits=(ep.hits||[]).filter(t=>now()-t<60e3);
  if(ep.hits.length>=20){ep.failed++;logSec('webhook.ratelimit','med','webhook sender','Rate limit exceeded (20/min)');save();return out(429,{error:'Too many requests. Slow down and retry.'})}
  ep.hits.push(now());
  if(String(fd.get('secret')||'')!==ep.secret){ep.failed++;logSec('webhook.auth_fail','high','webhook sender','Invalid X-Webhook-Secret on lead ingestion');save();return out(401,{error:'Invalid signature.'})}
  let p;try{p=JSON.parse(fd.get('payload'))}catch(e){ep.failed++;logSec('webhook.schema_fail','med','webhook sender','Malformed JSON payload');save();return out(400,{error:'Malformed JSON payload.'})}
  const fields=[];if(!p.name||String(p.name).trim().length<2)fields.push('name');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(p.email||'')))fields.push('email');
  if(fields.length){ep.failed++;logSec('webhook.schema_fail','med','webhook sender','Validation failed: '+fields.join(','));save();return out(400,{error:'Validation failed.',fields})}
  const agents=db.users.filter(x=>x.role==='agent'&&x.active);
  const assignee=agents[db.settings.rr++%agents.length];
  const l=createLead({name:String(p.name).trim().slice(0,80),email:String(p.email).trim().slice(0,120),phone:String(p.phone||'').slice(0,30),
    source:'Webhook',budgetMin:Math.max(0,+p.budget_min||0),budgetMax:Math.max(0,+p.budget_max||0),timeline:TIMELINES.includes(p.timeline)?p.timeline:'1-3 months',
    assignedTo:assignee.id,notes:'Received via lead ingestion webhook.'},null);
  ep.received++;
  const mgrs=db.users.filter(x=>isMgr(x)&&x.active).map(x=>x.id);
  notify([...mgrs,assignee.id],`New webhook lead: ${l.name} — assigned to ${assignee.name}`,'webhook');
  logSec('webhook.ingest','low','webhook sender',`Lead created for ${l.email} (score ${l.score})`);
  save();out(201,{status:'lead_created',lead_id:l.id,score:l.score,assigned_to:assignee.name},true);
  toast('Webhook delivered — lead created and routed.');renderMain();
};

   7 · COMMAND PALETTE (search + AI)
============================================================ */
let cmdItems=[];
function cmdRender(){
  const pop=$('#cmdPop'),q=S.cmd.trim();
  if(!q){pop.hidden=true;S.cmdOpen=false;return}
  S.cmdOpen=true;pop.hidden=false;
  const u=cur(),ql=q.toLowerCase();
  cmdItems=[];let html='';
  const ans=aiAnswer(q);
  if(ans){html+=`<div class="cmd-i" data-action="cmd.ans"><div style="flex:1"><span class="ans-h" style="padding:0">${icon('sparkle',13)} ${esc(ans.title)}</span><div class="ans-big">${ans.html.split('</div>')[0].replace('<div class="ans-big">','')}</div><div class="ans-p" style="padding:0 0 4px">Ask follow-ups or press Enter for the full brief</div></div></div>`;
    cmdItems.push({type:'ans',ans})}
  const groups=[];
  const leads=scopeLeads().filter(l=>(l.name+l.email).toLowerCase().includes(ql)).slice(0,4);
  if(leads.length)groups.push(['Leads',leads.map(l=>({ic:'users',l:l.name,sub:`score ${l.score} · ${LEAD_STATUS[l.status]}`,go:'lead',id:l.id}))]);
  const deals=scopeDeals().filter(d=>d.title.toLowerCase().includes(ql)).slice(0,4);
  if(deals.length)groups.push(['Deals',deals.map(d=>({ic:'board',l:d.title,sub:`${STAGES[d.stage].n} · ${fmt$M(d.value)}`,go:'deal',id:d.id}))]);
  const props=db.properties.filter(p=>p.orgId===u.orgId&&p.title.toLowerCase().includes(ql)).slice(0,3);
  if(props.length)groups.push(['Properties',props.map(p=>({ic:'building',l:p.title,sub:fmt$(p.price),go:'prop',id:p.id}))]);
  const navs=NAV.filter(n=>n.r&&(!n.p||can(u,n.p))&&n.l.toLowerCase().includes(ql)).slice(0,3);
  if(navs.length)groups.push(['Go to',navs.map(n=>({ic:n.i,l:n.l,sub:'page',go:'route',id:n.r}))]);
  groups.forEach(([lbl,items])=>{
    html+=`<div class="cmd-sec">${lbl}</div>`+items.map(it=>{const i=cmdItems.length;cmdItems.push(it);
      return`<button class="cmd-i ${i===S.cmdIdx?'sel':''}" data-action="cmd.go" data-i="${i}">${icon(it.ic,15)}<span>${esc(it.l)}</span><span class="sub">${esc(it.sub)}</span></button>`}).join('');
  });
  if(!cmdItems.length)html=`<div class="empty" style="padding:20px">No matches — try “pipeline forecast”, “hot leads” or a name.</div>`;
  pop.innerHTML=html;S.cmdIdx=clamp(S.cmdIdx,0,cmdItems.length-1);
}
INPUTS['cmdX']=()=>{};
ACTIONS['cmd.go']=(_,t)=>cmdPick(+t.dataset.i);
ACTIONS['cmd.ans']=()=>{const it=cmdItems.find(x=>x.type==='ans');if(it)openAns(it.ans)};
function cmdPick(i){
  const it=cmdItems[i];if(!it)return;
  S.cmd='';const inp=$('#cmd');if(inp){inp.value='';$('#cmdPop').hidden=true}
  if(it.type==='ans')return openAns(it.ans);
  if(it.go==='lead')return openLead(it.id);
  if(it.go==='deal')return openDeal(it.id);
  if(it.go==='prop'){const p=db.properties.find(x=>x.id===it.id);if(p)$(`[data-action="prop.open"][data-id="${p.id}"]`)||ACTIONS['prop.open'](null,{dataset:{id:p.id}});return}
  if(it.go==='route'){S.route=it.id;location.hash='#/'+it.id;renderMain();
    $$('.nav-i').forEach(el=>el.classList.toggle('on',el.dataset.r===it.id))}
}
function openAns(ans){
  openDrawer(`<div class="dw-h"><div><span class="ans-h" style="padding:0">${icon('sparkle',14)} Meridian Intelligence</span><h3 style="margin-top:4px">${esc(ans.title)}</h3></div><button class="btn gho dw-x" data-action="layer.close">${icon('x',18)}</button></div>
  <div class="dw-b"><div style="margin:6px -12px 0">${ans.html}</div>
  <p class="mini" style="margin-top:18px">Computed locally from your live records — role-scoped to what you're allowed to see.</p></div>`);
}

/* ============================================================
   8 · GLOBAL EVENTS · ROUTER · BOOT
============================================================ */
ACTIONS['nav']=(_,t)=>{S.route=t.dataset.r;location.hash='#/'+t.route||'';
  $$('.nav-i').forEach(el=>el.classList.toggle('on',el.dataset.r===S.route));renderMain()};
ACTIONS['logout']=()=>doLogout();
ACTIONS['layer.close']=()=>closeLayer();
ACTIONS['conf.yes']=(_,t)=>{
  if(t.dataset.typed){const v=$('[name="typedv"]')?.value;if(v!==t.dataset.typed)return toast('Type the confirmation word exactly.','err')}
  const cb=onConf;onConf=null;closeLayer();cb&&cb();
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]');
  if(!t){
    if(!e.target.closest('.cmd')){const p=$('#cmdPop');if(p){p.hidden=true;S.cmd='';const i=$('#cmd');if(i)i.value=''}}
    if(!e.target.closest('.bell')&&!e.target.closest('#notifPop')){$('#notifPop').innerHTML='';S.notifOpen=false}
    return;
  }
  const fn=ACTIONS[t.dataset.action];if(fn)fn(t.dataset.id,t,e);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const fn=FORMS[f.dataset.form];if(fn)fn(new FormData(f),f);
});
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-change]');if(!t)return;
  const fn=CHANGES[t.dataset.change];if(fn)fn(t.value,t);
});
document.addEventListener('input',e=>{
  const t=e.target.closest('#cmd');
  if(t){S.cmd=t.value;S.cmdIdx=0;cmdRender();return}
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#cmd')?.focus();return}
  if(e.key==='Escape'){closeLayer();const p=$('#cmdPop');if(p)p.hidden=true;return}
  if(S.cmdOpen&&(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='Enter')){
    e.preventDefault();
    if(e.key==='Enter')return cmdPick(S.cmdIdx);
    S.cmdIdx=clamp(S.cmdIdx+(e.key==='ArrowDown'?1:-1),0,Math.max(0,cmdItems.length-1));
    $$('#cmdPop .cmd-i').forEach((el,i)=>el.classList.toggle('sel',i===S.cmdIdx));
  }
});
function onRoute(){
  if(!cur())return renderLogin();
  const r=(location.hash||'').replace(/^#\//,'');
  if(r&&r!==S.route){S.route=r}
  renderMain();
  $$('.nav-i').forEach(el=>el.classList.toggle('on',el.dataset.r===S.route));
}
window.addEventListener('hashchange',onRoute);

(async function boot(){
  loadDB();
  if(!db||!db.users)await seedDB();
  try{const s=JSON.parse(localStorage.getItem(SESS_KEY));if(s&&s.uid&&db.users.find(u=>u.id===s.uid))SESSION=s}catch(e){}
  if(!location.hash)location.hash='#/dashboard';
  if(SESSION&&checkSession()){renderApp()}else{SESSION=null;renderLogin()}
})();
</script>
</body>
</html>
